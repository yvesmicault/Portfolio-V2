<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yves Micault · architecte</title>
<style>
:root{--bg:#0e0e0d;--fg:#efece4;--mu:#8d8a83;--ac:#d2553a;--ln:rgba(239,236,228,.07)}
:root[data-theme=day]{--bg:#efece4;--fg:#161615;--mu:#77746d;--ln:rgba(22,22,21,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(14px,env(safe-area-inset-top)) 16px 0;pointer-events:none;z-index:3}
header *{pointer-events:auto}
.brand{font-weight:700;letter-spacing:.04em;font-size:13px;cursor:pointer}
.brand small{display:block;font-weight:400;color:var(--mu);letter-spacing:0}
nav{display:flex;gap:14px;font-size:13px}
nav a{color:var(--mu);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px}
nav a::before{content:"";width:7px;height:7px;background:currentColor;opacity:.35;transition:.3s}
nav a.on{color:var(--fg)}nav a.on::before{background:var(--ac);opacity:1}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--ln);padding:5px;z-index:3;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;transition:opacity .4s}
.bar::-webkit-scrollbar{display:none}
.bar button{flex:none;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:8px 10px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.bar button.on{color:var(--bg);background:var(--fg)}
.bar .sep{flex:none;width:1px;height:20px;background:var(--ln);margin:0 3px}
.bar svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4}
.bar input{width:74px;accent-color:var(--ac)}
.hide{opacity:0;pointer-events:none}
#hint{position:fixed;left:16px;right:16px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 56px);text-align:center;color:var(--mu);font-size:12px;transition:opacity .6s;pointer-events:none;z-index:2}
#prof{position:fixed;z-index:2;left:16px;right:16px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 62px);transition:opacity .5s;max-width:420px}
#prof h1{font-size:clamp(28px,6vw,44px);line-height:1;letter-spacing:-.01em}
#prof p{color:var(--mu);margin:8px 0 12px}
#prof a{color:var(--fg);border-bottom:1px solid var(--ac);text-decoration:none;font-size:13px}
#sheet{position:fixed;inset:0;z-index:5;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .6s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}
#sheet.open{transform:none}
#sheet .in{max-width:980px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 60px}
#sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:12px;color:var(--mu)}
#sheet .x{background:none;border:0;color:var(--fg);font:inherit;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
#sheet .x::before{content:"";width:7px;height:7px;background:var(--ac)}
.hero{position:relative;width:100%;aspect-ratio:3/2;background:var(--ln);overflow:hidden}
.hero canvas,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero canvas{image-rendering:pixelated;transition:opacity .9s ease}
#sheet h2{font-size:clamp(26px,5vw,40px);line-height:1.05;margin:18px 0 4px}
#sheet .ln{color:var(--mu)}
#sheet dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:18px 0;font-size:13px}
#sheet dt{color:var(--mu)}
#sheet .tx{max-width:640px;margin:0 0 18px}
#sheet .pl img{width:100%;display:block;margin-top:10px}
#sheet .lk{color:var(--fg);border-bottom:1px solid var(--ac);text-decoration:none}
@media(max-width:560px){nav{gap:10px}nav a::before{display:none}.brand small{display:none}}
#ttl{position:fixed;left:0;right:0;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 70px);text-align:center;z-index:2;cursor:pointer;transition:opacity .5s}
#tw{font-size:clamp(34px,8vw,64px);font-weight:700;letter-spacing:-.02em;line-height:1;transition:opacity .18s,transform .3s}
#tn{display:block;color:var(--mu);font-size:12px;margin-top:6px}
#hint{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 150px)}
.sbx{display:block;margin-top:14px;border:0!important;color:var(--mu)!important;font-size:11px!important;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header>
  <div class="brand" id="brand">YVES MICAULT<small>architecte HMONP</small></div>
  <nav id="nav"><a data-m="a">Agence</a><a data-m="c">Concours</a><a data-m="e">Études</a><a data-m="prof">Profil</a></nav>
</header>
<div id="ttl"><div id="tw"></div><small id="tn"></small></div>
<div id="hint">Glissez pour tourner le cube · touchez-le pour entrer</div>
<div class="bar" id="bar"></div>
<div id="prof" class="hide"><h1>Yves Micault</h1><p>Architecte HMONP</p><a href="doc/CV_2026_Yves_Micault.pdf" target="_blank" rel="noopener">Télécharger le CV (PDF)</a><a id="sbx" class="sbx">▪ jouer avec les pixels</a></div>
<div id="sheet"><div class="in" id="sin"></div></div>
<script src="data.js"></script>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,DPR;
const root=document.documentElement;
const TH={night:{bg:'#0e0e0d',top:[239,236,228],s1:[150,147,140],s2:[84,82,78],ac:[210,85,58],grid:'rgba(239,236,228,.06)',txt:'#efece4',mu:'#8d8a83'},
          day:{bg:'#efece4',top:[22,22,21],s1:[92,90,86],s2:[150,147,140],ac:[210,85,58],grid:'rgba(22,22,21,.07)',txt:'#161615',mu:'#77746d'}};
let th=TH.night;
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const mob=()=>W<700;

// ---------- état ----------
// Tout est fait de pixels. Chaque pixel appartient à un groupe posé à l'écran (ax,ay) ;
// la vue tourne chaque groupe sur lui-même : plan (dessus) ou axo, 4 orientations.
let mode='home', tool='sq', AX=0, hz=0, q=0, ang=0;   // AX: 0 plan, 1 axo ; q: quart de tour
let C=20, Ct=20, pan=0, panT=0, maxPan=0;
let P=[], sand=new Map(), tiles=[], hoverTile=-1, intro=0, introT0=0;
let ptr={x:-1e4,y:-1e4,down:false,moved:0,sx:0,sy:0,inside:false};
const CATS=[{id:'a',t:'Agence'},{id:'c',t:'Concours'},{id:'e',t:'Études'},{id:'prof',t:'Profil'}];
const N=6; let home={ax:0,ay:0};

function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);
  home.ax=W/2;home.ay=H*(mob()?.46:.47);
  if(mode=='home')layoutHome();if(tiles.length&&mode.length==1)layoutProj(true);if(mode=='prof')layoutProf();if(mode=='sand')Ct=C=mob()?16:20}
addEventListener('resize',resize);

// ---------- projection locale ----------
let ca=1,sa=0,kk=1;
function setView(){ca=Math.cos(ang);sa=Math.sin(ang);kk=1-.45*hz}
function lp(p,x,y,z){const X=x*ca-y*sa,Y=x*sa+y*ca;return [p.ax+X*C,p.ay+(Y*kk-z*hz*.84)*C-(p.sc?pan:0)]}
function unl(ax,ay,sx,sy){const X=(sx-ax)/C,Y=(sy-ay)/C/kk;return [X*ca+Y*sa,-X*sa+Y*ca]}

// ---------- pixels ----------
function mk(o){return Object.assign({x:0,y:0,tx:0,ty:0,ax:0,ay:0,tax:0,tay:0,s:0,ts:1,h:0,thh:1,tone:0,tt:0,d:0,dead:false,sc:0},o)}
const key=(i,j)=>i+','+j;
function setField(list){
  const old=P.filter(p=>!p.dead),now=performance.now(),out=[];
  old.sort((a,b)=>a.ay+a.y*C-b.ay-b.y*C||a.ax+a.x*C-b.ax-b.x*C);
  list.sort((a,b)=>a.ay+a.y*C-b.ay-b.y*C||a.ax+a.x*C-b.ax-b.x*C);
  list.forEach((t,i)=>{let p=old[Math.floor(i*old.length/list.length)];
    if(p&&!p.used)p.used=1;else p=mk(p?{x:p.x,y:p.y,ax:p.ax,ay:p.ay,s:p.s*.5}:{x:t.x,y:t.y,ax:t.ax,ay:t.ay});
    Object.assign(p,{tx:t.x,ty:t.y,tax:t.ax,tay:t.ay,ts:t.s,thh:t.h??1,tt:t.tone||0,k:t.k,tile:t.tile??-1,face:t.face??-1,sc:t.sc||0,d:now+(t.d||0),dead:false});out.push(p)});
  old.forEach(p=>{if(!p.used){p.ts=0;p.dead=true;p.tile=-1;out.push(p)}});
  out.forEach(p=>delete p.used);P=out;
}

// ---------- accueil : le cube ----------
function layoutHome(){
  Ct=Math.min(W*(mob()?.5:.3),H*.34)/N/1.15;const o=-N/2,out=[];
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)out.push({x:o+i,y:o+j,s:.93,h:N,ax:home.ax,ay:home.ay,d:(i+j)*22,
    face:j==N-1?0:i==N-1?1:j==0?2:i==0?3:-1});
  setField(out);
}
// face active = celle tournée vers le bas-gauche de l'écran
function faceN(f){return [[0,1],[1,0],[0,-1],[-1,0]][f]}
function active(){let best=0,bv=-9;for(let f=0;f<4;f++){const [nx,ny]=faceN(f);const X=nx*ca-ny*sa,Y=nx*sa+ny*ca;const v=Y-X*.3*hz;if(v>bv){bv=v;best=f}}return best}
let curF=-1;
const tw=document.getElementById('tw'),tn=document.getElementById('tn'),ttl=document.getElementById('ttl');
function showCat(f){if(f==curF)return;curF=f;tw.style.opacity=0;tw.style.transform='translateY(8px)';
  setTimeout(()=>{tw.textContent=CATS[f].t;const c=CATS[f];tn.textContent=c.id=='prof'?'CV · portrait':`${PRO.filter(p=>p.fam==c.id).length} projets`;tw.style.opacity=1;tw.style.transform='none'},180)}

// ---------- sandbox (cachée) ----------
function seedSand(){if(sand.size)return;const n=5,o=-2;for(let i=0;i<n;i++)for(let j=0;j<n;j++)sand.set(key(o+i,o+j),{i:o+i,j:o+j,h:1,a:i==n-1&&j==0})}
const sandList=()=>[...sand.values()].map(c=>({x:c.i,y:c.j,s:1,h:c.h,tone:c.a?1:0,k:key(c.i,c.j),ax:W/2,ay:H/2}));
function paint(sx,sy){
  const [x,y]=unl(W/2,H/2,sx,sy);const i=Math.floor(x),j=Math.floor(y),k=key(i,j);
  if(ptr.last==k)return;ptr.last=k;const c=sand.get(k),fp=()=>P.find(p=>p.k==k&&!p.dead);
  const add=()=>{sand.set(k,{i,j,h:1});P.push(mk({x:i,y:j,tx:i,ty:j,ax:W/2,ay:H/2,tax:W/2,tay:H/2,s:0,ts:1,thh:1,k}))};
  if(tool=='er'){if(c){sand.delete(k);const p=fp();if(p){p.ts=0;p.dead=true}}}
  else if(!c)add();else if(tool=='cu'){c.h=Math.min(14,c.h+1);const p=fp();if(p)p.thh=c.h}
}

// ---------- images → pixels ----------
const cache={};
function sample(src,nx,ny){return new Promise(res=>{const K=src+nx+'x'+ny;if(cache[K])return res(cache[K]);
  const im=new Image();im.onload=()=>{const o=document.createElement('canvas');o.width=nx;o.height=ny;const c=o.getContext('2d');
    const r=Math.max(nx/im.width,ny/im.height),w=im.width*r,h=im.height*r;c.drawImage(im,(nx-w)/2,(ny-h)/2,w,h);
    const d=c.getImageData(0,0,nx,ny).data,L=[];for(let i=0;i<nx*ny;i++)L.push((.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2])/255);
    cache[K]=L;res(L)};im.onerror=()=>res(null);im.src=src})}
function glyph(id,n){let h=2166136261;for(const ch of id){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}
  const L=[];for(let j=0;j<n;j++)for(let i=0;i<n;i++){const ii=Math.min(i,n-1-i);h=Math.imul(h^(ii*31+j*17),2654435761);L.push(((h>>>((ii+j)%24))&3)==0?.95:.12)}
  for(let j=0;j<n;j++)for(let i=0;i<n;i++)L[j*n+i]=L[j*n+Math.min(i,n-1-i)];return L}

// ---------- projets : une grille d'écran, chaque projet tourne sur lui-même ----------
const T=8,FAM={a:'Agence',c:'Concours',e:'Études'},PRO=window.PROJ||[];
async function layoutProj(keep){
  const list=PRO.filter(p=>p.fam==mode);const cols=W<700?2:W<1100?4:5;
  const cw=(W-32)/cols,rh=cw*.92+34;Ct=cw/(T*1.55);
  tiles=list.map((p,n)=>({p,ax:16+cw*(n%cols+.5),ay:96+cw*.42+Math.floor(n/cols)*rh,r:cw*.46}));
  maxPan=Math.max(0,96+Math.ceil(list.length/cols)*rh-(H-80));
  const L=await Promise.all(tiles.map(t=>t.p.th?sample(t.p.th,T,T):null));
  if(mode!=list[0]?.fam)return;
  const out=[];
  tiles.forEach((t,n)=>{const l=L[n]||glyph(t.p.id,T);
    for(let j=0;j<T;j++)for(let i=0;i<T;i++){const v=l[j*T+i];
      out.push({x:i-T/2,y:j-T/2,ax:t.ax,ay:t.ay,sc:1,s:.18+.82*v,h:.4+v*3,tile:n,d:keep?0:n*30+(i+j)*8})}});
  setField(out);
}
// ---------- profil ----------
async function layoutProf(){
  const n=mob()?30:40;Ct=Math.min((W-32)/n/1.3,(H-260)/n,mob()?10:12);
  const L=await sample('img/yves_cv.jpg',n,n);if(!L||mode!='prof')return;
  const out=[],ay=mob()?H*.38:H*.42;
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){const v=L[j*n+i];if(v<.06)continue;out.push({x:i-n/2,y:j-n/2,ax:W/2,ay,s:.12+.88*v,h:v*5,d:(j*n+i)%97*4+j*8})}
  setField(out);
}

// ---------- barre ----------
const bar=document.getElementById('bar'),hint=document.getElementById('hint'),prof=document.getElementById('prof');
const I={sq:'<svg viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8" fill="currentColor"/></svg>',
 cu:'<svg viewBox="0 0 14 14"><path d="M7 1.5 12.5 4.5v5L7 12.5 1.5 9.5v-5zM7 7.5v5M1.5 4.5 7 7.5l5.5-3"/></svg>',
 er:'<svg viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8"/></svg>',
 l:'<svg viewBox="0 0 14 14"><path d="M11.5 5A5 5 0 1 0 12 9M11.5 1.5V5H8"/></svg>',
 r:'<svg viewBox="0 0 14 14"><path d="M2.5 5A5 5 0 1 1 2 9M2.5 1.5V5H6"/></svg>'};
function views(){return `<button data-v="0">${I.sq}Plan</button><button data-v="1">${I.cu}Axo</button><span class="sep"></span><button data-r="-1" title="Tourner">${I.l}</button><button data-r="1" title="Tourner">${I.r}</button>`}
function buildBar(){
  bar.innerHTML=(mode=='sand'?`<button data-t="sq">${I.sq}Carré</button><button data-t="cu">${I.cu}Cube</button><button data-t="er">${I.er}Gomme</button><span class="sep"></span><button data-a="clr">Effacer</button><span class="sep"></span>`:'')+views();sync()}
function sync(){bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t==tool&&mode=='sand'||b.dataset.v==AX));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.m==mode))}
function turn(d){q+=d;if(mode=='home')hint.style.opacity=0}
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t){tool=b.dataset.t;if(tool=='cu')AX=1}
  if(b.dataset.v)AX=+b.dataset.v;
  if(b.dataset.r)turn(+b.dataset.r);
  if(b.dataset.a=='clr'){P.forEach(p=>{p.ts=0;p.dead=true});sand.clear()}
  sync()});
function go(m){if(m==mode)return;const was=mode;mode=m;panT=0;hoverTile=-1;
  prof.classList.toggle('hide',m!='prof');hint.style.opacity=0;ttl.classList.toggle('hide',m!='home');
  if(m=='home'){layoutHome();curF=-1}
  if(m.length==1)layoutProj();
  if(m=='prof')layoutProf();
  if(m=='sand'){Ct=mob()?16:20;seedSand();setField(sandList())}
  buildBar()}
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a)go(a.dataset.m)});
document.getElementById('brand').addEventListener('click',()=>go('home'));
document.getElementById('sbx').addEventListener('click',()=>go('sand'));
ttl.addEventListener('click',()=>{if(mode=='home'&&curF>=0)go(CATS[curF].id)});
addEventListener('keydown',e=>{if(e.key=='Escape')sheet.classList.remove('open');if(e.key=='ArrowLeft')turn(-1);if(e.key=='ArrowRight')turn(1);
  if(e.key=='Enter'&&mode=='home')go(CATS[curF].id)});

// ---------- fiche ----------
const sheet=document.getElementById('sheet'),sin=document.getElementById('sin');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openP(p){const src=p.hero||p.th;
  sin.innerHTML=`<div class="top"><span>${FAM[p.fam]} · ${esc(p.y)}</span><button class="x" id="cl">Fermer</button></div>
  ${src?`<div class="hero"><img src="${src}" alt=""><canvas width="24" height="16"></canvas></div>`:''}
  <h2>${esc(p.t)}</h2><div class="ln">${esc(p.line||p.c||'')}</div>
  ${p.fiche?`<dl>${p.fiche.map(f=>`<dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd>`).join('')}</dl>`:''}
  ${p.txt?`<p class="tx">${esc(p.txt)}</p>`:''}
  ${p.url?`<p><a class="lk" href="${esc(p.url)}" target="_blank" rel="noopener">Voir la fiche du projet</a></p>`:''}
  <div class="pl">${(p.pl||[]).map(s=>`<img loading="lazy" src="${s}" alt="">`).join('')}</div>`;
  sheet.scrollTop=0;sheet.classList.add('open');document.getElementById('cl').onclick=()=>sheet.classList.remove('open');
  const c=sin.querySelector('.hero canvas');
  if(c){const im=new Image();im.onload=()=>{const x=c.getContext('2d'),r=Math.max(24/im.width,16/im.height);x.drawImage(im,(24-im.width*r)/2,(16-im.height*r)/2,im.width*r,im.height*r);setTimeout(()=>c.style.opacity=0,350)};im.src=src}}

// ---------- pointeur ----------
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);Object.assign(ptr,{down:true,moved:0,sx:e.clientX,sy:e.clientY,p0:panT,last:null,x:e.clientX,y:e.clientY,turned:0});
  if(mode=='sand')paint(e.clientX,e.clientY)});
cv.addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;ptr.inside=true;if(!ptr.down)return;
  const dx=e.clientX-ptr.sx,dy=e.clientY-ptr.sy;ptr.moved=Math.max(ptr.moved,Math.hypot(dx,dy));
  if(mode=='sand')paint(e.clientX,e.clientY);
  if(mode=='home'){const st=Math.round(dx/70);if(st!=ptr.turned){turn(ptr.turned-st);ptr.turned=st;if(!AX){AX=1;sync()}}}
  if(mode.length==1)panT=Math.max(0,Math.min(maxPan,ptr.p0-dy))});
cv.addEventListener('pointerup',e=>{ptr.down=false;if(e.pointerType!='mouse')ptr.x=ptr.y=-1e4;
  if(ptr.moved<8){if(mode.length==1){const t=tileAt(e.clientX,e.clientY);if(t>=0)openP(tiles[t].p)}
    if(mode=='home'&&Math.hypot(e.clientX-home.ax,e.clientY-home.ay)<N*C)go(CATS[curF].id)}});
cv.addEventListener('pointerleave',()=>{ptr.inside=false;ptr.x=ptr.y=-1e4});
cv.addEventListener('wheel',e=>{if(mode.length==1){panT=Math.max(0,Math.min(maxPan,panT+e.deltaY));e.preventDefault()}},{passive:false});
function tileAt(sx,sy){return tiles.findIndex(t=>Math.abs(sx-t.ax)<t.r&&Math.abs(sy+pan-t.ay)<t.r)}

// ---------- dessin ----------
function quad(a,b,c,d,col){g.fillStyle=col;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.lineTo(d[0],d[1]);g.closePath();g.fill()}
function grid(){const R=Math.ceil(Math.hypot(W,H)/C/2)+2;g.strokeStyle=th.grid;g.lineWidth=1;g.beginPath();const o={ax:W/2,ay:H/2};
  for(let i=-R;i<=R;i++){let a=lp(o,i,-R,0),b=lp(o,i,R,0);g.moveTo(...a);g.lineTo(...b);a=lp(o,-R,i,0);b=lp(o,R,i,0);g.moveTo(...a);g.lineTo(...b)}g.stroke()}
const SIDES=[[0,1,'y1'],[1,0,'x1'],[0,-1,'y0'],[-1,0,'x0']];
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last);last=now;
  const f=1-Math.pow(.004,dt/1000),fs=1-Math.pow(.0006,dt/1000);
  const tAng=AX||mode=='home'||mode=='sand'?q*Math.PI/2+(AX?Math.PI/4:0):Math.round(q/4)*Math.PI*2; // en plan, images et portrait restent à l'endroit
  ang+=(tAng-ang)*f;hz+=(AX-hz)*f;C+=(Ct-C)*f;pan+=(panT-pan)*fs;setView();
  g.fillStyle=th.bg;g.fillRect(0,0,W,H);
  if(mode=='sand')grid();
  if(mode.length==1){const t=ptr.inside&&!ptr.down?tileAt(ptr.x,ptr.y):-1;if(t!=hoverTile){hoverTile=t;cv.style.cursor=t>=0?'pointer':'default'}}
  else cv.style.cursor=mode=='sand'?'crosshair':mode=='home'?'grab':'default';
  const af=mode=='home'?active():-1;if(mode=='home'&&intro>=1)showCat(af);
  const [mx,my]=ptr.x>-1e3?unl(W/2,mob()?H*.38:H*.42,ptr.x,ptr.y):[1e9,1e9];

  for(const p of P){if(now<p.d)continue;
    p.x+=(p.tx-p.x)*f;p.y+=(p.ty-p.y)*f;p.ax+=(p.tax-p.ax)*f;p.ay+=(p.tay-p.ay)*f;
    let ts=p.ts,th2=p.thh,tt=p.tt;
    if(p.tile>=0&&p.tile==hoverTile){ts=1;th2=p.thh+2}
    if(mode=='prof'){const d=Math.hypot(p.tx+.5-mx,p.ty+.5-my);if(d<6){const k=1-d/6;ts=Math.min(1,p.ts+k*.6);th2=p.thh+k*8}}
    if(mode=='home')tt=p.face==af?1:0;
    p.s+=(ts-p.s)*f;p.h+=(th2-p.h)*f;p.tone+=(tt-p.tone)*f}
  P=P.filter(p=>!(p.dead&&p.s<.02));
  P.sort((a,b)=>(a.ay-(a.sc?pan:0)+(a.x*sa+a.y*ca)*C*kk)-(b.ay-(b.sc?pan:0)+(b.x*sa+b.y*ca)*C*kk));

  const top=rgb(th.top),ac=th.ac;
  // faces latérales visibles et leur teinte (lumière fixe venant de l'écran haut-gauche)
  const vis=SIDES.map(([nx,ny])=>{const X=nx*ca-ny*sa,Y=nx*sa+ny*ca;return {Y,col:mix(th.s2,th.s1,Math.max(0,Math.min(1,.5-X*.6)))}});
  for(const p of P){if(p.s<.01)continue;
    const yy=p.ay-(p.sc?pan:0);if(yy<-200||yy>H+200)continue;
    const a=p.s/2,cx=p.x+.5,cy=p.y+.5,x0=cx-a,x1=cx+a,y0=cy-a,y1=cy+a,z=Math.max(0,p.h)*Math.min(1,p.s*1.4);
    const tc=p.tone>.01?rgb(mix(th.top,ac,p.tone)):top;
    if(hz*z>.02){
      const B={x0y0:lp(p,x0,y0,0),x1y0:lp(p,x1,y0,0),x1y1:lp(p,x1,y1,0),x0y1:lp(p,x0,y1,0)},
            Tz={x0y0:lp(p,x0,y0,z),x1y0:lp(p,x1,y0,z),x1y1:lp(p,x1,y1,z),x0y1:lp(p,x0,y1,z)};
      const E=[['x0y1','x1y1'],['x1y0','x1y1'],['x0y0','x1y0'],['x0y0','x0y1']];
      for(let s=0;s<4;s++){if(vis[s].Y<=0.01)continue;const [u,v]=E[s];
        quad(B[u],B[v],Tz[v],Tz[u],rgb(p.tone>.01&&mode=='home'?mix(vis[s].col,ac,p.tone*.85):vis[s].col))}
      quad(Tz.x0y0,Tz.x1y0,Tz.x1y1,Tz.x0y1,mode=='home'?rgb(mix(th.top,ac,p.tone*Math.max(0,1-hz*1.6))):tc);
    }else quad(lp(p,x0,y0,0),lp(p,x1,y0,0),lp(p,x1,y1,0),lp(p,x0,y1,0),tc);
  }
  // légendes des projets, sous chaque maquette, toujours lisibles
  if(mode.length==1){g.font='12px "Helvetica Neue",Helvetica,Arial,sans-serif';g.textBaseline='top';g.textAlign='center';
    tiles.forEach((t,n)=>{const y=t.ay-pan+t.r*.95;if(y<-20||y>H)return;
      g.fillStyle=n==hoverTile?th.txt:th.mu;g.fillText(t.p.t.length>26?t.p.t.slice(0,25)+'…':t.p.t,t.ax,y);
      g.globalAlpha=.6;g.fillText(String(t.p.y),t.ax,y+15);g.globalAlpha=1});g.textAlign='left'}
  // plan de l'accueil : les 4 côtés portent les 4 rubriques
  if(mode=='home'&&intro>=1&&hz<.5){g.globalAlpha=1-hz*2;g.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';g.textAlign='center';g.textBaseline='middle';
    const o=N/2+1.1;for(let s=0;s<4;s++){const [nx,ny]=faceN(s);const pt=lp(home,nx*o,ny*o,0);g.fillStyle=s==af?rgb(ac):th.mu;g.fillText(CATS[s].t.toUpperCase(),pt[0],pt[1])}
    g.globalAlpha=1;g.textAlign='left'}
  if(mode=='sand'&&ptr.x>-1e3){const [x,y]=unl(W/2,H/2,ptr.x,ptr.y),i=Math.floor(x),j=Math.floor(y),o={ax:W/2,ay:H/2};
    g.strokeStyle=rgb(ac);g.lineWidth=1.5;g.beginPath();g.moveTo(...lp(o,i,j,0));g.lineTo(...lp(o,i+1,j,0));g.lineTo(...lp(o,i+1,j+1,0));g.lineTo(...lp(o,i,j+1,0));g.closePath();g.stroke()}
  if(intro<1){intro=Math.min(1,(now-introT0)/1400);drawIntro(intro)}
  requestAnimationFrame(frame);
}
// ouverture : le contour du carré se trace, puis les pixels le remplissent
function drawIntro(t){const o=-N/2,pts=[[o,o],[o+N,o],[o+N,o+N],[o,o+N],[o,o]].map(([x,y])=>lp(home,x,y,0)),k=Math.min(1,t/.55)*4;
  g.strokeStyle=rgb(th.top);g.lineWidth=1.5;g.globalAlpha=1-Math.max(0,(t-.8)/.2);g.beginPath();g.moveTo(...pts[0]);
  for(let s=0;s<4;s++){const e=Math.min(1,Math.max(0,k-s));if(e<=0)break;const a=pts[s],b=pts[s+1];g.lineTo(a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e)}g.stroke();g.globalAlpha=1}
function start(){resize();layoutHome();C=Ct;const now=performance.now();
  P.forEach(p=>{p.x=p.tx;p.y=p.ty;p.ax=p.tax;p.ay=p.tay;p.s=0;p.d=now+800+(p.tx+p.ty+N)*45});
  buildBar();ttl.classList.add('hide');introT0=now;setTimeout(()=>ttl.classList.remove('hide'),1500);requestAnimationFrame(frame)}
start();
})();
</script>
