<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yves Micault — Cube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
:root{--bg:#eeebe4;--ink:#171716;--mute:#8b867c;--line:#d6d0c4;--tile:#f7f5f0;
  --a:#46525e;--c:#2f6e8c;--e:#b46a5a;--p:#b8a37e;--r:#6f8270;--m:#efece6;
  --mono:"IBM Plex Mono",ui-monospace,monospace;--sans:"Jost",system-ui,sans-serif}
body.nuit{--bg:#121212;--ink:#ecebe6;--mute:#8d8a83;--line:#33322f;--tile:#1c1c1b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;transition:background .5s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;transition:opacity .6s,filter .6s}
body.page canvas#gl{opacity:.1;filter:blur(2px);pointer-events:none}

header{position:fixed;inset:0 0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:20;pointer-events:none}
header>*{pointer-events:auto}
.brand b{display:block;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.14em}
.brand span{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.06em}
#bgBtn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 0}

/* le menu : les six faces */
#menu{position:fixed;left:0;right:0;bottom:0;padding:0 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:16px;z-index:10;transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1)}
body.page #menu{opacity:0;transform:translateY(30px);pointer-events:none}
body.intro #menu{opacity:0}
#faces{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#faces button{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px;padding:4px 0;transition:color .3s}
#faces button i{width:7px;height:7px;display:inline-block;transition:transform .3s}
#faces button.on{color:var(--ink)}#faces button.on i{transform:scale(1.5)}
#go{display:flex;align-items:baseline;gap:14px}
#go b{font-weight:300;font-size:clamp(30px,8vw,44px);letter-spacing:-.01em;line-height:1}
#go span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#openBtn{display:flex;align-items:center;gap:12px}
#openBtn em{font-style:normal;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:16px;transition:transform .3s}
#openBtn:hover em{transform:translateX(4px)}
.hint{font-family:var(--mono);font-size:9.5px;color:var(--mute);letter-spacing:.05em}

/* une partie : index éditorial */
#page{position:fixed;inset:0;z-index:15;overflow-y:auto;padding:calc(70px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));visibility:hidden}
body.page #page{visibility:visible}
.pin{max-width:880px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--ink);padding-bottom:12px}
.ph h1{font-weight:300;font-size:clamp(44px,13vw,96px);line-height:.9;letter-spacing:-.02em}
.ph p{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:right}
.back{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:22px;display:flex;align-items:center;gap:8px}
.list{list-style:none}
.list li{border-bottom:1px solid var(--line)}
.list button{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;padding:14px 0;text-align:left}
.list svg{width:26px;height:26px}
.list .t{font-size:clamp(19px,5vw,26px);line-height:1.1;font-weight:400}
.list .t small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.list .y{font-family:var(--mono);font-size:11px;color:var(--mute)}
.list button:hover .t{transform:translateX(6px)}.list .t{transition:transform .3s}
body.page .list li{animation:li .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--i)*45ms)}
body.page .ph,body.page .back{animation:li .6s cubic-bezier(.2,.8,.2,1) both .1s}
@keyframes li{from{opacity:0;transform:translateY(18px)}}
.prof p{font-size:16px;line-height:1.6;margin-top:16px;text-align:justify;hyphens:auto}
.prof dl{margin-top:20px}
dl div{display:grid;grid-template-columns:7.5em 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.4}
dt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-top:3px}
dd a{color:inherit}

/* fiche projet */
#sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;transform:translateY(100%);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
.sh-top{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.sh-top button,.sh-top span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 0}
.sh-in{max-width:1080px;margin:0 auto;padding:18px 18px 70px}
.hero{aspect-ratio:4/3;background:var(--tile);overflow:hidden;position:relative}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero svg{position:absolute;inset:25%;width:50%;height:50%}
.fam{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:18px}
.fam svg{width:14px;height:14px}
.sh-in h2{font-weight:300;font-size:clamp(36px,10vw,64px);line-height:.95;letter-spacing:-.01em;margin:10px 0 8px}
.ln{font-size:15px;color:var(--mute)}
.sh-in dl{margin-top:20px;border-top:1px solid var(--ink)}
.txt{font-size:16px;line-height:1.6;margin-top:20px;text-align:justify;hyphens:auto}
.sec{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:28px 0 10px;display:flex;justify-content:space-between}
.pl{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pl button{aspect-ratio:1;background:var(--tile);overflow:hidden}.pl img{width:100%;height:100%;object-fit:cover;display:block}
.links{display:flex;flex-direction:column;margin-top:24px;border-top:1px solid var(--ink)}
.links a{color:inherit;text-decoration:none;display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.cr{font-family:var(--mono);font-size:9.5px;color:var(--mute);margin-top:6px}
@media (min-width:860px){.cols{display:grid;grid-template-columns:1fr 1fr;gap:48px}.hero{aspect-ratio:16/9}#page{padding-top:110px}}
#lb{position:fixed;inset:0;background:#111;z-index:50;display:none}#lb.on{display:block}
#lb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#lb .x{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top));color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;z-index:2}
#lb .n{position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top));color:#aaa;font-family:var(--mono);font-size:11px}
#lb .pv,#lb .nx{position:absolute;top:0;bottom:0;width:35%;z-index:1}#lb .pv{left:0}#lb .nx{right:0}
</style>
</head>
<body class="intro">
<canvas id="gl"></canvas>
<header>
  <div class="brand"><b>YVES MICAULT</b><span>architecte HMONP</span></div>
  <button id="bgBtn">Nuit</button>
</header>

<nav id="menu">
  <div id="faces"></div>
  <button id="openBtn" aria-label="Ouvrir la partie"><span id="go"><b id="goName"></b><span id="goInfo"></span></span><em>→</em></button>
  <p class="hint">Faites tourner le cube · touchez une face pour l’ouvrir</p>
</nav>

<section id="page" aria-label="Partie"></section>
<section id="sheet" aria-label="Fiche"><div class="sh-top"><button id="shClose">↓ Fermer</button><span id="shN"></span></div><div class="sh-in" id="shIn"></div></section>
<div id="lb"><span class="n" id="lbN"></span><button class="x" id="lbX">Fermer ×</button><img id="lbI" alt=""><button class="pv" id="lbP" aria-label="Précédente"></button><button class="nx" id="lbNx" aria-label="Suivante"></button></div>

<script src="data.js"></script>
<script type="module">
import * as THREE from "three";
import {RoundedBoxGeometry} from "./vendor/RoundedBoxGeometry.js";
const $=id=>document.getElementById(id);
const ALL=window.PROJ,PUB=window.PUB,CV=window.CV;
const cssv=v=>getComputedStyle(document.body).getPropertyValue(v).trim();

/* ---------- les six parties = les six faces ---------- */
const byFam=f=>ALL.filter(p=>p.fam==f).sort((a,b)=>b.y-a.y);
const FACES=[
 {k:"a",name:"Agence",col:"--a",n:[0,0,1],items:byFam("a"),info:"Hamonic+Masson · depuis 2017"},
 {k:"c",name:"Concours",col:"--c",n:[1,0,0],items:byFam("c"),info:"Concours d’idées, Europan"},
 {k:"e",name:"Études",col:"--e",n:[0,0,-1],items:byFam("e"),info:"ENSA Clermont-Ferrand"},
 {k:"p",name:"Publications",col:"--p",n:[-1,0,0],items:PUB.map(b=>({id:b.id,t:b.t,c:`${b.pages.length} pages`,y:b.y,pub:b})),info:"Books et documents"},
 {k:"m",name:"Profil",col:"--m",n:[0,1,0],items:[],info:"Marseille · disponible janvier 2027"},
 {k:"r",name:"Parcours",col:"--r",n:[0,-1,0],items:CV.map((s,i)=>({id:"cv"+i,t:`CV 2026 · page ${i+1}`,c:"Curriculum",y:"",cv:i})),info:"CV 2026"}];
const count=f=>f.k=="m"?f.info:`${f.items.length} ${f.k=="p"?"documents":f.k=="r"?"pages":"projets"}`;

/* ---------- glyphe 3×3 propre à chaque projet ---------- */
function bitsOf(id){let h=2166136261;for(const c of id){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
  for(let k=0;k<40;k++){const b=(h>>>(k%23))&511;const n=b.toString(2).split("1").length-1;if(n>=4&&n<=6)return b;h=Math.imul(h^k,2654435761)>>>0}return 0b101010101}
function glyph(id,col){const b=bitsOf(id);let r="";for(let i=0;i<9;i++){const x=i%3,y=i/3|0;
  r+=b>>i&1?`<rect x="${x+.08}" y="${y+.08}" width=".84" height=".84" rx=".12" fill="${col}"/>`:`<rect x="${x+.08}" y="${y+.08}" width=".84" height=".84" rx=".12" fill="none" stroke="${col}" stroke-width=".06" opacity=".45"/>`}
  return `<svg viewBox="0 0 3 3" aria-hidden="true">${r}</svg>`}

/* ---------- scène : axonométrie (caméra orthographique) ---------- */
const cv=$("gl");
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(2,devicePixelRatio));
R.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);cam.position.set(10,8.2,10);cam.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8478,1.55));
const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(4,10,6);scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,.45);fill.position.set(-8,2,-3);scene.add(fill);
const root=new THREE.Group();scene.add(root);      // orientation d'ensemble (glisser)
const cube=new THREE.Group();root.add(cube);        // les 27 cubes

const body=new THREE.MeshStandardMaterial({color:0x1d1d1c,roughness:.62,metalness:.05});
const geo=new RoundedBoxGeometry(.95,.95,.95,4,.09);
function stickerGeo(){const s=.78,r=.1,h=s/2,sh=new THREE.Shape();sh.moveTo(-h+r,-h);sh.lineTo(h-r,-h);sh.quadraticCurveTo(h,-h,h,-h+r);sh.lineTo(h,h-r);sh.quadraticCurveTo(h,h,h-r,h);sh.lineTo(-h+r,h);sh.quadraticCurveTo(-h,h,-h,h-r);sh.lineTo(-h,-h+r);sh.quadraticCurveTo(-h,-h,-h+r,-h);return new THREE.ShapeGeometry(sh,4)}
const sg=stickerGeo();
const mats=FACES.map(f=>new THREE.MeshStandardMaterial({color:new THREE.Color(cssv(f.col)),roughness:.48,metalness:0}));
const cubies=[];
for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
  const g=new THREE.Group();g.add(new THREE.Mesh(geo,body));
  FACES.forEach((f,i)=>{const n=new THREE.Vector3(...f.n);if(n.x&&n.x!=x||n.y&&n.y!=y||n.z&&n.z!=z)return;
    const m=new THREE.Mesh(sg,mats[i]);m.position.copy(n).multiplyScalar(.477);m.lookAt(n.clone().multiplyScalar(2));m.userData.face=i;g.add(m)});
  g.position.set(x,y,z);g.userData.home=new THREE.Vector3(x,y,z);cube.add(g);cubies.push(g)}

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);const a=w/h;
  const v=w<700?(w/h<.6?4.6:3.9):3.3;   // demi-hauteur visible
  cam.left=-v*a;cam.right=v*a;cam.top=v;cam.bottom=-v;
  cam.position.set(10,8.2,10);cam.lookAt(0,0,0);
  // le cube monte un peu au-dessus du menu
  cam.position.y+= w<700?-1.4:-.6;cam.updateProjectionMatrix()}
addEventListener("resize",resize);resize();

/* ---------- petit moteur d'animation ---------- */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,4);
let tweens=[];function tween(d,fn,{delay=0,e=ease,done}={}){return new Promise(res=>tweens.push({t0:performance.now()+delay,d,fn,e,done:()=>{done&&done();res()}}))}
function runTweens(now){tweens=tweens.filter(tw=>{const t=Math.min(1,Math.max(0,(now-tw.t0)/tw.d));if(now<tw.t0)return true;tw.fn(tw.e(t));if(t>=1){tw.done();return false}return true})}

/* ---------- ouverture : le plan se lève et s'assemble ---------- */
async function intro(){
  // 1. trois plans posés les uns au-dessus des autres (axonométrie éclatée des étages), qui se dessinent case par case
  cubies.forEach(c=>{const h=c.userData.home;c.position.set(h.x*1.08,h.y*2.1-.3,h.z*1.08);c.scale.set(.001,.04,.001)});
  await Promise.all(cubies.map(c=>{const h=c.userData.home;
    return tween(520,t=>{c.scale.set(t,.04,t)},{delay:(1-h.y)*260+((h.x+1)+(h.z+1)*3)*34,e:easeOut})}));
  await tween(250,()=>{});
  // 2. les plans s'extrudent et se resserrent : le cube se forme
  await Promise.all(cubies.map(c=>{const h=c.userData.home;const a=c.position.clone();
    return tween(1000,t=>{c.position.set(a.x+(h.x-a.x)*t,a.y+(h.y-a.y)*t,a.z+(h.z-a.z)*t);c.scale.set(1,.04+.96*t,1)},{delay:(h.y+1)*90,e:ease})}));
  document.body.classList.remove("intro");idleOn=true;
}

/* ---------- orientation : glisser pour tourner, puis le cube se cale sur une face ---------- */
let q=new THREE.Quaternion(),qT=new THREE.Quaternion(),spin=0,drag=null,last=0,idleOn=false,lastTouch=0;
const camDir=()=>new THREE.Vector3().subVectors(cam.position,new THREE.Vector3()).normalize();
function activeFace(){const cd=new THREE.Vector3(1,.35,1).normalize();let b=0,bv=-9;
  FACES.forEach((f,i)=>{const n=new THREE.Vector3(...f.n).applyQuaternion(root.quaternion);const v=n.dot(new THREE.Vector3(0,0,1))*0.6+n.dot(cd)*0.4;if(v>bv){bv=v;b=i}});return b}
// mettre une face « devant » : sa normale vers +z (face avant gauche de l'axonométrie)
function faceTo(i){const n=new THREE.Vector3(...FACES[i].n);const qq=new THREE.Quaternion().setFromUnitVectors(n,new THREE.Vector3(0,0,1));
  if(Math.abs(n.y)>.5){qq.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),n.y>0?.55:-.55))}
  qT.copy(qq).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),0));lastTouch=performance.now()}
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now()};cv.setPointerCapture(e.pointerId);lastTouch=performance.now()});
cv.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  const k=.0085;const qy=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),dx*k);
  const ax=new THREE.Vector3(1,0,-1).normalize();const qx=new THREE.Quaternion().setFromAxisAngle(ax,dy*k);
  qT.premultiply(qy).premultiply(qx);root.quaternion.copy(qT);lastTouch=performance.now()});
cv.addEventListener("pointerup",e=>{if(!drag)return;const moved=Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0);drag=null;
  if(moved<8){const hit=pick(e);if(hit!=null){faceTo(hit);setTimeout(()=>openFace(hit),380)}return}
  faceTo(activeFace())});
const ray=new THREE.Raycaster();
function pick(e){const r=cv.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam);
  const hs=ray.intersectObjects(cube.children,true);if(!hs.length)return null;
  // la face touchée : la normale du point le plus proche, ramenée au cube
  const n=hs[0].face.normal.clone().transformDirection(hs[0].object.matrixWorld).applyQuaternion(root.quaternion.clone().invert());
  let b=0,bv=-9;FACES.forEach((f,i)=>{const v=n.dot(new THREE.Vector3(...f.n));if(v>bv){bv=v;b=i}});return b}

/* ---------- au repos : le cube tourne lentement, et de temps en temps une couronne pivote puis revient ---------- */
let twisting=false;
async function twist(){if(twisting||document.body.classList.contains("page"))return;twisting=true;
  const axes=["x","y","z"],ax=axes[Math.random()*3|0],layer=[-1,1][Math.random()*2|0],dir=Math.random()<.5?1:-1;
  const sel=cubies.filter(c=>Math.round(c.position[ax])==layer);
  const piv=new THREE.Group();cube.add(piv);sel.forEach(c=>piv.attach(c));
  await tween(650,t=>{piv.rotation[ax]=dir*Math.PI/2*t});
  await tween(500,()=>{},{});   // pause
  await tween(650,t=>{piv.rotation[ax]=dir*Math.PI/2*(1-t)});
  sel.forEach(c=>{cube.attach(c);c.position.set(Math.round(c.position.x),Math.round(c.position.y),Math.round(c.position.z));c.rotation.set(0,0,0)});
  cube.remove(piv);twisting=false}
setInterval(()=>{if(idleOn&&performance.now()-lastTouch>2500)twist()},4200);

/* ---------- ouvrir une partie : le cube éclate, l'index monte ---------- */
async function explode(on){await Promise.all(cubies.map(c=>{const h=c.position.clone();const a=c.userData.ex||(c.userData.ex=new THREE.Vector3((Math.random()-.5)*.6,(Math.random()-.5)*.6,(Math.random()-.5)*.6));
  const s=on?1:0;return tween(on?700:800,t=>{const k=on?t:1-t;c.position.copy(c.userData.homePos||h);c.userData.homePos=c.userData.homePos||h.clone();
    c.position.copy(c.userData.homePos).multiplyScalar(1+k*1.15).add(a.clone().multiplyScalar(k));c.rotation.set(a.x*k*3,a.y*k*3,a.z*k*3)},{e:on?easeOut:ease,done:()=>{if(!on){c.position.copy(c.userData.homePos);c.rotation.set(0,0,0);c.userData.homePos=null}}})}))}
let curFace=0;
function setMenu(i){curFace=i;const f=FACES[i];$("goName").textContent=f.name;$("goInfo").textContent=count(f);
  [...$("faces").children].forEach((b,j)=>b.classList.toggle("on",j==i))}
$("faces").innerHTML=FACES.map((f,i)=>`<button data-i="${i}"><i style="background:var(${f.col});${f.k=="m"?"box-shadow:inset 0 0 0 1px var(--ink)":""}"></i>${f.name}</button>`).join("");
$("faces").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;faceTo(+b.dataset.i);setMenu(+b.dataset.i)});
$("openBtn").onclick=()=>openFace(curFace);
async function openFace(i){if(document.body.classList.contains("page"))return;setMenu(i);const f=FACES[i];
  explode(true);setTimeout(()=>{renderPage(f);document.body.classList.add("page");$("page").scrollTop=0},260);history.pushState({f:i},"","#"+f.k)}
async function closePage(){if(!document.body.classList.contains("page"))return;document.body.classList.remove("page");await explode(false)}
addEventListener("popstate",()=>{closeSheet();closeLb();if(!location.hash)closePage()});

function renderPage(f){const col=`var(${f.col})`;
  if(f.k=="m"){$("page").innerHTML=`<div class="pin"><button class="back" data-back>← Cube</button><div class="ph"><h1>Profil</h1><p>Yves Micault<br>architecte HMONP</p></div>
    <div class="prof"><dl><div><dt>Courriel</dt><dd><a href="mailto:ymicault@gmail.com">ymicault@gmail.com</a></dd></div><div><dt>Téléphone</dt><dd>+33 7 60 86 66 62</dd></div><div><dt>Ville</dt><dd>Marseille, France</dd></div><div><dt>En agence</dt><dd>Hamonic + Masson</dd></div><div><dt>Disponible</dt><dd>À partir de janvier 2027</dd></div><div><dt>CV</dt><dd><a href="doc/CV_2026_Yves_Micault.pdf" target="_blank" rel="noopener">Télécharger le CV 2026 ↓</a></dd></div></dl>
    <p>« L’architecture ne se résume pas à ce que l’on construit, mais à ce que l’on rend possible. »</p>
    <p>Mon parcours s’est construit entre Reims, Clermont-Ferrand et Moscou, au fil d’une formation qui m’a progressivement amené à considérer l’architecture au-delà du seul acte de bâtir. Le master EVAN, consacré aux relations entre ville, architecture et nature, a notamment nourri une réflexion sur les territoires, leurs transformations et les liens parfois fragiles qui unissent le paysage, le bâti et les usages.</p>
    <p>Depuis 2017, cette approche s’est enrichie d’une pratique professionnelle au sein de l’agence Hamonic + Masson, à Paris puis à Marseille. De la conception aux phases de développement technique, à travers des projets de logements, d’équipements et d’opérations urbaines, j’ai appris à confronter l’intention architecturale à la complexité du réel.</p></div></div>`;return}
  $("page").innerHTML=`<div class="pin"><button class="back" data-back>← Cube</button><div class="ph"><h1>${f.name}</h1><p>${count(f)}<br>${f.info}</p></div>
   <ul class="list">${f.items.map((p,j)=>`<li style="--i:${Math.min(j,16)}"><button data-id="${p.id}">${glyph(p.id,col)}<span class="t">${p.t}<small>${p.fam=="a"?p.role+" · ":""}${(p.c||"").split(",")[0]}</small></span><span class="y">${p.y||""}</span></button></li>`).join("")}</ul>
   ${f.k=="r"?`<p style="margin-top:22px"><a href="doc/CV_2026_Yves_Micault.pdf" target="_blank" rel="noopener" style="color:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase">Télécharger le CV 2026 ↓</a></p>`:""}</div>`}
$("page").addEventListener("click",e=>{if(e.target.closest("[data-back]"))return history.back();const b=e.target.closest("[data-id]");if(!b)return;
  const f=FACES[curFace],it=f.items.find(p=>p.id==b.dataset.id);if(!it)return;
  if(it.pub){lbList=it.pub.pages;return openLb(0)}if(it.cv!=null){lbList=CV;return openLb(it.cv)}openSheet(it)});

/* ---------- fiche projet ---------- */
let lbList=[],lbI=0;
function openSheet(p){const col=`var(--${p.fam})`;
  const rows=(p.fiche||[]).filter(r=>r[1]&&r[1]!="—").map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("");
  const pl=(p.pl||[]).filter(x=>x!=p.hero);
  const links=[p.url?`<a href="${p.url}" target="_blank" rel="noopener">Fiche du projet chez Hamonic+Masson <span>↗</span></a>`:"",
    p.fam!="a"?`<a href="https://yvesmicault.com/#projet/${p.id}" target="_blank" rel="noopener">Maquette 3D interactive (site actuel) <span>↗</span></a>`:""].join("");
  $("shIn").innerHTML=`<div class="hero">${p.hero?`<img src="${p.hero}" alt="${p.t}">`:glyph(p.id,col)}</div>${p.cr?`<p class="cr">${p.cr}</p>`:""}
   <div class="cols"><div><div class="fam">${glyph(p.id,col)}${{a:"Agence",c:"Concours",e:"Études"}[p.fam]} · ${p.role}</div><h2>${p.t}</h2><p class="ln">${p.line||p.c+" · "+p.y}</p><dl>${rows}</dl>${links?`<div class="links">${links}</div>`:""}</div>
   <div>${p.txt?`<p class="txt">${p.txt}</p>`:""}${pl.length?`<div class="sec"><span>Planches et images</span><span>${pl.length}</span></div><div class="pl">${pl.map((s,i)=>`<button data-lb="${i}"><img loading="lazy" src="${s}" alt="${p.t}, image ${i+1}"></button>`).join("")}</div>`:""}</div></div>`;
  lbList=pl;$("shN").textContent=p.y;$("sheet").scrollTop=0;$("sheet").classList.add("on")}
function closeSheet(){$("sheet").classList.remove("on")}
$("shClose").onclick=closeSheet;$("shIn").addEventListener("click",e=>{const b=e.target.closest("[data-lb]");b&&openLb(+b.dataset.lb)});
function openLb(i){lbI=i;$("lb").classList.add("on");showLb()}
function showLb(){$("lbI").src=lbList[lbI];$("lbN").textContent=`${lbI+1} / ${lbList.length}`}
function lbStep(d){lbI=(lbI+d+lbList.length)%lbList.length;showLb()}
function closeLb(){$("lb").classList.remove("on")}
$("lbX").onclick=closeLb;$("lbP").onclick=()=>lbStep(-1);$("lbNx").onclick=()=>lbStep(1);
let lx=null;$("lb").addEventListener("touchstart",e=>lx=e.touches[0].clientX,{passive:true});$("lb").addEventListener("touchend",e=>{if(lx==null)return;const d=e.changedTouches[0].clientX-lx;lx=null;if(Math.abs(d)>50)lbStep(d<0?1:-1)},{passive:true});
addEventListener("keydown",e=>{if(e.key=="Escape"){if($("lb").classList.contains("on"))return closeLb();if($("sheet").classList.contains("on"))return closeSheet();if(document.body.classList.contains("page"))return history.back()}
  if($("lb").classList.contains("on")){e.key=="ArrowRight"&&lbStep(1);e.key=="ArrowLeft"&&lbStep(-1);return}
  if(document.body.classList.contains("page"))return;
  if(e.key=="ArrowRight"||e.key=="ArrowLeft"){const order=[0,1,2,3];const k=order.indexOf(curFace);const n=order[((k<0?0:k)+(e.key=="ArrowRight"?1:3))%4];faceTo(n);setMenu(n)}
  if(e.key=="ArrowUp"){faceTo(4);setMenu(4)}if(e.key=="ArrowDown"){faceTo(5);setMenu(5)}if(e.key=="Enter")openFace(curFace)});

/* nuit / jour : les couleurs des faces suivent */
$("bgBtn").onclick=()=>{document.body.classList.toggle("nuit");$("bgBtn").textContent=document.body.classList.contains("nuit")?"Jour":"Nuit";
  FACES.forEach((f,i)=>mats[i].color.set(cssv(f.col)))};

/* ---------- boucle ---------- */
faceTo(0);setMenu(0);
const base=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),0);
let t0=performance.now();
function loop(now){requestAnimationFrame(loop);runTweens(now);
  const dt=Math.min(50,now-t0);t0=now;
  if(!drag){
    // au repos : une lente dérive autour de la verticale
    if(idleOn&&now-lastTouch>2500)qT.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),dt*.00018));
    root.quaternion.slerp(qT,1-Math.pow(.0025,dt/1000));
  }
  const a=activeFace();if(a!=curFace&&!document.body.classList.contains("page"))setMenu(a);
  R.render(scene,cam)}
requestAnimationFrame(loop);
intro();
if(location.hash){const i=FACES.findIndex(f=>"#"+f.k==location.hash);if(i>=0)setTimeout(()=>openFace(i),2400)}
</script>
</body>
</html>
