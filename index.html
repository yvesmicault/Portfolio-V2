<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yves Micault · architecte</title>
<style>
:root{--bg:#0e0e0d;--fg:#efece4;--mu:#8d8a83;--ac:#d2553a;--ln:rgba(239,236,228,.07)}
:root[data-theme=day]{--bg:#efece4;--fg:#161615;--mu:#77746d;--ln:rgba(22,22,21,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(14px,env(safe-area-inset-top)) 16px 0;pointer-events:none;z-index:3}
header *{pointer-events:auto}
.brand{font-weight:700;letter-spacing:.04em;font-size:13px;cursor:pointer}
.brand small{display:block;font-weight:400;color:var(--mu);letter-spacing:0}
nav{display:flex;gap:14px;font-size:13px}
nav a{color:var(--mu);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px}
nav a::before{content:"";width:7px;height:7px;background:currentColor;opacity:.35;transition:.3s}
nav a.on{color:var(--fg)}nav a.on::before{background:var(--ac);opacity:1}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--ln);padding:5px;z-index:3;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;transition:opacity .4s}
.bar::-webkit-scrollbar{display:none}
.bar button{flex:none;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:8px 10px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.bar button.on{color:var(--bg);background:var(--fg)}
.bar .sep{flex:none;width:1px;height:20px;background:var(--ln);margin:0 3px}
.bar svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4}
.bar input{width:74px;accent-color:var(--ac)}
.hide{opacity:0;pointer-events:none}
#hint{position:fixed;left:16px;right:16px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 56px);text-align:center;color:var(--mu);font-size:12px;transition:opacity .6s;pointer-events:none;z-index:2}
#prof{position:fixed;z-index:2;left:16px;right:16px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 62px);transition:opacity .5s;max-width:420px}
#prof h1{font-size:clamp(28px,6vw,44px);line-height:1;letter-spacing:-.01em}
#prof p{color:var(--mu);margin:8px 0 12px}
#prof a{color:var(--fg);border-bottom:1px solid var(--ac);text-decoration:none;font-size:13px}
#sheet{position:fixed;inset:0;z-index:5;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .6s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}
#sheet.open{transform:none}
#sheet .in{max-width:980px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 60px}
#sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:12px;color:var(--mu)}
#sheet .x{background:none;border:0;color:var(--fg);font:inherit;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
#sheet .x::before{content:"";width:7px;height:7px;background:var(--ac)}
.hero{position:relative;width:100%;aspect-ratio:3/2;background:var(--ln);overflow:hidden}
.hero canvas,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero canvas{image-rendering:pixelated;transition:opacity .9s ease}
#sheet h2{font-size:clamp(26px,5vw,40px);line-height:1.05;margin:18px 0 4px}
#sheet .ln{color:var(--mu)}
#sheet dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:18px 0;font-size:13px}
#sheet dt{color:var(--mu)}
#sheet .tx{max-width:640px;margin:0 0 18px}
#sheet .pl img{width:100%;display:block;margin-top:10px}
#sheet .lk{color:var(--fg);border-bottom:1px solid var(--ac);text-decoration:none}
@media(max-width:560px){nav{gap:10px}nav a::before{display:none}.brand small{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header>
  <div class="brand" id="brand">YVES MICAULT<small>architecte HMONP</small></div>
  <nav id="nav"><a data-m="sand" class="on">Sandbox</a><a data-m="proj">Projets</a><a data-m="prof">Profil</a></nav>
</header>
<div id="hint">Dessinez. Chaque carré est un pixel : regardez-le de biais, c’est un cube.</div>
<div class="bar" id="bar"></div>
<div id="prof" class="hide"><h1>Yves Micault</h1><p>Architecte HMONP</p><a href="doc/CV_2026_Yves_Micault.pdf" target="_blank" rel="noopener">Télécharger le CV (PDF)</a></div>
<div id="sheet"><div class="in" id="sin"></div></div>
<script src="data.js"></script>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,DPR;
const root=document.documentElement;
const TH={night:{bg:'#0e0e0d',top:[239,236,228],s1:[141,138,131],s2:[84,82,78],ac:[210,85,58],grid:'rgba(239,236,228,.06)',txt:'#efece4',mu:'#8d8a83'},
          day:{bg:'#efece4',top:[22,22,21],s1:[92,90,86],s2:[150,147,140],ac:[210,85,58],grid:'rgba(22,22,21,.07)',txt:'#161615',mu:'#77746d'}};
let th=TH.night;
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

// ---------- state ----------
let mode='sand', tool='sq', V=0, vv=0;           // V: 0 carré, 1 losange, 2 axo
let C=22, Ct=22, pan=0, panT=0, maxPan=0;
let P=[];                                         // pixels on screen
let sand=new Map();                               // the sandbox drawing (persists)
let ptr={x:-1e4,y:-1e4,down:false,moved:0,sx:0,sy:0,inside:false};
let tiles=[], hoverTile=-1, filt='all', intro=0, introT0=0;
const mob=()=>W<700;

function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);if(mode=='proj')layoutProj(true);if(mode=='prof')layoutProf()}
addEventListener('resize',resize);

// ---------- projection : carré → losange → axo ----------
let cr=1,sr=0,kk=1,hz=0;
function setView(){const r=Math.PI/4*Math.min(vv,1);cr=Math.cos(r);sr=Math.sin(r);kk=1-.42*Math.max(0,vv-1);hz=Math.max(0,vv-1)}
function px(x,y,z){const X=x*cr-y*sr,Y=x*sr+y*cr;return [W/2+X*C,H/2+(Y*kk-z*hz*.82)*C-pan]}
function unp(sx,sy){const X=(sx-W/2)/C,Y=(sy+pan-H/2)/C/kk;return [X*cr+Y*sr,-X*sr+Y*cr]}

// ---------- pixels ----------
function mk(o){return Object.assign({x:0,y:0,tx:0,ty:0,s:0,ts:1,h:0,thh:1,tone:0,tt:0,d:0,dead:false},o)}
const key=(i,j)=>i+','+j;
function setField(list,{scatter=false}={}){
  // reuse current pixels, fly them to new targets
  const old=P.filter(p=>!p.dead);
  old.sort((a,b)=>a.y-b.y||a.x-b.x);list.sort((a,b)=>a.y-b.y||a.x-b.x);
  const out=[];const now=performance.now();
  list.forEach((t,i)=>{let p=old[Math.floor(i*old.length/list.length)];
    if(p&&!p.used){p.used=1}else{p=mk({x:p?p.x:t.x,y:p?p.y:t.y,s:0})}
    p.tx=t.x;p.ty=t.y;p.ts=t.s;p.thh=t.h??1;p.tt=t.tone||0;p.k=t.k;p.tile=t.tile;p.d=now+(t.d||0);p.dead=false;out.push(p)});
  old.forEach(p=>{if(!p.used){p.ts=0;p.dead=true;p.tile=-1;out.push(p)}delete p.used});
  out.forEach(p=>delete p.used);
  P=out;
}
function sandList(){return [...sand.values()].map(c=>({x:c.i,y:c.j,s:1,h:c.h,tone:c.a?1:0,k:key(c.i,c.j)}))}

// ---------- sandbox ----------
function seedSand(){
  sand.clear();const n=5,o=-Math.floor(n/2);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)sand.set(key(o+i,o+j-1),{i:o+i,j:o+j-1,h:1,a:(i==n-1&&j==0)});
}
function paint(sx,sy){
  const [x,y]=unp(sx,sy);const i=Math.floor(x),j=Math.floor(y),k=key(i,j);
  if(ptr.last==k)return;ptr.last=k;
  const c=sand.get(k);
  if(tool=='er'){if(c){sand.delete(k);const p=P.find(p=>p.k==k&&!p.dead);if(p){p.ts=0;p.dead=true}}return}
  if(tool=='sq'){if(!c){sand.set(k,{i,j,h:1});P.push(mk({x:i,y:j,tx:i,ty:j,s:0,ts:1,h:0,thh:1,k}))}return}
  if(tool=='cu'){if(!c){sand.set(k,{i,j,h:1});P.push(mk({x:i,y:j,tx:i,ty:j,s:0,ts:1,h:0,thh:1,k}))}
    else{c.h=Math.min(14,c.h+1);const p=P.find(p=>p.k==k&&!p.dead);if(p)p.thh=c.h}}
}
function density(nc){
  // resample the drawing on a new cell size, keeping its screen footprint
  const f=C/nc,m=new Map();
  sand.forEach(c=>{for(let a=0;a<Math.max(1,Math.round(f));a++)for(let b=0;b<Math.max(1,Math.round(f));b++){
    const i=Math.floor(c.i*f)+a,j=Math.floor(c.j*f)+b;m.set(key(i,j),{i,j,h:Math.max(1,Math.round(c.h*f)),a:c.a})}});
  if(f<1){m.clear();sand.forEach(c=>{const i=Math.floor(c.i*f),j=Math.floor(c.j*f),k=key(i,j);const o=m.get(k);if(!o||o.h<c.h*f)m.set(k,{i,j,h:Math.max(1,Math.round(c.h*f)),a:c.a||(o&&o.a)})})}
  sand=m;C=Ct=nc;setField(sandList());P.forEach(p=>{p.x=p.tx;p.y=p.ty;p.s=p.ts*.2});
}

// ---------- images → pixels ----------
const cache={};
function sample(src,nx,ny){return new Promise(res=>{if(cache[src+nx+ny])return res(cache[src+nx+ny]);
  const im=new Image();im.onload=()=>{const o=document.createElement('canvas');o.width=nx;o.height=ny;const q=o.getContext('2d');
    const r=Math.max(nx/im.width,ny/im.height),w=im.width*r,h=im.height*r;q.drawImage(im,(nx-w)/2,(ny-h)/2,w,h);
    const d=q.getImageData(0,0,nx,ny).data,L=[];for(let i=0;i<nx*ny;i++)L.push((.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2])/255);
    cache[src+nx+ny]=L;res(L)};im.onerror=()=>res(null);im.src=src})}
function glyph(id,n){ // projects without image: a symmetric pixel signature from the id
  let h=2166136261;for(const ch of id){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}
  const L=[];for(let j=0;j<n;j++)for(let i=0;i<n;i++){const ii=Math.min(i,n-1-i);h=Math.imul(h^(ii*31+j*17),2654435761);
    L.push(((h>>>((ii+j)%24))&3)==0?.95:.12)}
  // mirror
  for(let j=0;j<n;j++)for(let i=0;i<n;i++)L[j*n+i]=L[j*n+Math.min(i,n-1-i)];return L}

// ---------- projets ----------
const T=8; const FAM={a:'Agence',c:'Concours',e:'Études'};
const LIST=(window.PROJ||[]);
async function layoutProj(keep){
  const list=LIST.filter(p=>filt=='all'||p.fam==filt);
  const cols=W<700?3:W<1100?5:7,gap=3,capt=3;
  Ct=Math.min(12,(W-32)/(cols*T+(cols-1)*gap));if(!keep)C=C;
  const x0=-(cols*T+(cols-1)*gap)/2, y0=-(H/2-74)/Ct;
  tiles=list.map((p,n)=>({p,x:x0+(n%cols)*(T+gap),y:y0+Math.floor(n/cols)*(T+capt+1)}));
  const rows=Math.ceil(list.length/cols);maxPan=Math.max(0,(rows*(T+capt+1))*Ct-(H-150));
  const L=await Promise.all(tiles.map(t=>t.p.th?sample(t.p.th,T,T):Promise.resolve(null)));
  const out=[];
  tiles.forEach((t,n)=>{const l=L[n]||glyph(t.p.id,T);
    for(let j=0;j<T;j++)for(let i=0;i<T;i++){const v=l[j*T+i];
      out.push({x:t.x+i,y:t.y+j,s:.18+.82*v,h:.4+v*3,tile:n,d:n*18+(i+j)*6,tone:t.p.fam=='a'?0:0})}});
  if(mode=='proj')setField(out);
}
// ---------- profil ----------
async function layoutProf(){
  const n=mob()?30:40;Ct=Math.min((W-32)/n,(H-230)/n,mob()?11:13);
  const L=await sample('img/yves_cv.jpg',n,n);if(!L||mode!='prof')return;
  const out=[];const ox=-n/2,oy=-n/2-(mob()?9:5);
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){const v=L[j*n+i];if(v<.06)continue;out.push({x:ox+i,y:oy+j,s:.12+.88*v,h:v*5,d:(j*n+i)%97*4+j*8})}
  setField(out);
}

// ---------- modes ----------
const bar=document.getElementById('bar'),hint=document.getElementById('hint'),prof=document.getElementById('prof');
const ICO={sq:'<svg viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8" fill="currentColor"/></svg>',
 cu:'<svg viewBox="0 0 14 14"><path d="M7 1.5 12.5 4.5v5L7 12.5 1.5 9.5v-5zM7 7.5v5M1.5 4.5 7 7.5l5.5-3"/></svg>',
 er:'<svg viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8"/></svg>',
 v0:'<svg viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8"/></svg>',
 v1:'<svg viewBox="0 0 14 14"><path d="M7 1.5 12.5 7 7 12.5 1.5 7z"/></svg>',
 v2:'<svg viewBox="0 0 14 14"><path d="M7 1.5 12.5 4.5v5L7 12.5 1.5 9.5v-5zM7 7.5v5M1.5 4.5 7 7.5l5.5-3"/></svg>'};
function views(){return `<span class="sep"></span><button data-v="0" title="Carré">${ICO.v0}</button><button data-v="1" title="Losange">${ICO.v1}</button><button data-v="2" title="Cube">${ICO.v2}</button>`}
function buildBar(){
  if(mode=='sand')bar.innerHTML=`<button data-t="sq">${ICO.sq}Carré</button><button data-t="cu">${ICO.cu}Cube</button><button data-t="er">${ICO.er}Gomme</button>${views()}<span class="sep"></span><input id="den" type="range" min="8" max="44" step="2" value="${C}" title="Densité"><button data-a="clr">Effacer</button>`;
  else if(mode=='proj')bar.innerHTML=['all','a','c','e'].map(f=>`<button data-f="${f}">${f=='all'?'Tout':FAM[f]}</button>`).join('')+views();
  else bar.innerHTML=views().replace('<span class="sep"></span>','');
  sync();
}
function sync(){bar.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.t==tool&&mode=='sand'||b.dataset.v==V||b.dataset.f==filt&&mode=='proj')});
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.m==mode))}
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t){tool=b.dataset.t;if(tool=='cu'&&V<2)V=2}
  if(b.dataset.v)V=+b.dataset.v;
  if(b.dataset.f){filt=b.dataset.f;panT=0;layoutProj()}
  if(b.dataset.a=='clr'){P.forEach(p=>{p.ts=0;p.dead=true});sand.clear()}
  sync();hint.style.opacity=0});
bar.addEventListener('input',e=>{if(e.target.id=='den')density(+e.target.value)});
function go(m){if(m==mode)return;mode=m;panT=0;hoverTile=-1;
  prof.classList.toggle('hide',m!='prof');hint.style.opacity=0;
  if(m=='sand'){Ct=mob()?18:22;setField(sandList())}
  if(m=='proj')layoutProj();
  if(m=='prof'){V=V==1?0:V;layoutProf()}
  buildBar()}
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a)go(a.dataset.m)});
document.getElementById('brand').addEventListener('click',()=>go('sand'));
document.getElementById('brand').addEventListener('dblclick',()=>{const d=root.dataset.theme!='day';root.dataset.theme=d?'day':'';th=d?TH.day:TH.night});

// ---------- fiche projet ----------
const sheet=document.getElementById('sheet'),sin=document.getElementById('sin');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openP(p){
  const src=p.hero||p.th;
  sin.innerHTML=`<div class="top"><span>${FAM[p.fam]} · ${esc(p.y)}</span><button class="x" id="cl">Fermer</button></div>
  ${src?`<div class="hero"><img src="${src}" alt=""><canvas width="24" height="16"></canvas></div>`:''}
  <h2>${esc(p.t)}</h2><div class="ln">${esc(p.line||p.c||'')}</div>
  ${p.fiche?`<dl>${p.fiche.map(f=>`<dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd>`).join('')}</dl>`:''}
  ${p.txt?`<p class="tx">${esc(p.txt)}</p>`:''}
  ${p.url?`<p><a class="lk" href="${esc(p.url)}" target="_blank" rel="noopener">Voir la fiche du projet</a></p>`:''}
  <div class="pl">${(p.pl||[]).map(s=>`<img loading="lazy" src="${s}" alt="">`).join('')}</div>`;
  sheet.scrollTop=0;sheet.classList.add('open');
  document.getElementById('cl').onclick=()=>sheet.classList.remove('open');
  const c=sin.querySelector('.hero canvas');
  if(c){const im=new Image();im.onload=()=>{const q=c.getContext('2d');const r=Math.max(24/im.width,16/im.height);q.drawImage(im,(24-im.width*r)/2,(16-im.height*r)/2,im.width*r,im.height*r);setTimeout(()=>c.style.opacity=0,350)};im.src=src}
}
addEventListener('keydown',e=>{if(e.key=='Escape')sheet.classList.remove('open')});

// ---------- pointer ----------
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.down=true;ptr.moved=0;ptr.sx=e.clientX;ptr.sy=e.clientY;ptr.p0=panT;ptr.last=null;ptr.x=e.clientX;ptr.y=e.clientY;
  if(mode=='sand'&&intro>=1){hint.style.opacity=0;paint(e.clientX,e.clientY)}});
cv.addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;ptr.inside=true;
  if(!ptr.down)return;ptr.moved=Math.max(ptr.moved,Math.hypot(e.clientX-ptr.sx,e.clientY-ptr.sy));
  if(mode=='sand'&&intro>=1)paint(e.clientX,e.clientY);
  if(mode=='proj')panT=Math.max(0,Math.min(maxPan,ptr.p0-(e.clientY-ptr.sy)))});
cv.addEventListener('pointerup',e=>{ptr.down=false;if(e.pointerType!='mouse'){ptr.x=ptr.y=-1e4}
  if(mode=='proj'&&ptr.moved<8){const t=tileAt(e.clientX,e.clientY);if(t>=0)openP(tiles[t].p)}});
cv.addEventListener('pointerleave',()=>{ptr.inside=false;ptr.x=ptr.y=-1e4});
cv.addEventListener('wheel',e=>{if(mode=='proj'){panT=Math.max(0,Math.min(maxPan,panT+e.deltaY));e.preventDefault()}},{passive:false});
function tileAt(sx,sy){const [x,y]=unp(sx,sy);return tiles.findIndex(t=>x>=t.x&&x<t.x+T&&y>=t.y&&y<t.y+T+2)}

// ---------- draw ----------
function quad(a,b,c,d,col){g.fillStyle=col;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.lineTo(d[0],d[1]);g.closePath();g.fill()}
function grid(){
  const [ax,ay]=unp(0,0),[bx,by]=unp(W,H),[cx,cy]=unp(W,0),[dx,dy]=unp(0,H);
  const x0=Math.floor(Math.min(ax,bx,cx,dx)),x1=Math.ceil(Math.max(ax,bx,cx,dx)),y0=Math.floor(Math.min(ay,by,cy,dy)),y1=Math.ceil(Math.max(ay,by,cy,dy));
  if((x1-x0)+(y1-y0)>600)return;
  g.strokeStyle=th.grid;g.lineWidth=1;g.beginPath();
  for(let i=x0;i<=x1;i++){const a=px(i,y0,0),b=px(i,y1,0);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1])}
  for(let j=y0;j<=y1;j++){const a=px(x0,j,0),b=px(x1,j,0);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1])}
  g.stroke();
}
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last);last=now;
  const f=1-Math.pow(.004,dt/1000),fs=1-Math.pow(.0005,dt/1000);
  vv+=(V-vv)*f;if(Math.abs(V-vv)<1e-3)vv=V;C+=(Ct-C)*f;pan+=(panT-pan)*fs;setView();
  g.fillStyle=th.bg;g.fillRect(0,0,W,H);
  if(mode=='sand')grid();

  // hover (desktop) on project tiles
  if(mode=='proj'){const t=ptr.inside&&!ptr.down?tileAt(ptr.x,ptr.y):-1;if(t!=hoverTile){hoverTile=t;cv.style.cursor=t>=0?'pointer':'default'}}
  else cv.style.cursor=mode=='sand'?'crosshair':'default';
  const [mx,my]=ptr.x>-1e3?unp(ptr.x,ptr.y):[1e9,1e9];

  // update
  for(const p of P){if(now<p.d)continue;
    p.x+=(p.tx-p.x)*f;p.y+=(p.ty-p.y)*f;
    let ts=p.ts,th2=p.thh;
    if(mode=='proj'&&p.tile==hoverTile&&hoverTile>=0){ts=1;th2=p.thh+2}
    if(mode=='prof'){const d=Math.hypot(p.tx+.5-mx,p.ty+.5-my);if(d<6){const k=1-d/6;ts=Math.min(1,p.ts+k*.6);th2=p.thh+k*8}}
    p.s+=(ts-p.s)*f;p.h+=(th2-p.h)*f;p.tone+=(p.tt-p.tone)*f}
  P=P.filter(p=>!(p.dead&&p.s<.02));
  // painter's order
  if(hz>0||sr>0)P.sort((a,b)=>(a.x+a.y)-(b.x+b.y));

  const top=rgb(th.top),s1=rgb(th.s1),s2=rgb(th.s2),ac=rgb(th.ac);
  for(const p of P){if(p.s<.01)continue;
    const a=p.s/2,cx=p.x+.5,cy=p.y+.5,x0=cx-a,x1=cx+a,y0=cy-a,y1=cy+a,z=Math.max(0,p.h)*Math.min(1,p.s*1.4);
    const col=p.tone>.5?ac:top;
    if(hz*z>.02){
      const b00=px(x0,y0,0),b10=px(x1,y0,0),b11=px(x1,y1,0),b01=px(x0,y1,0),t00=px(x0,y0,z),t10=px(x1,y0,z),t11=px(x1,y1,z),t01=px(x0,y1,z);
      quad(b01,b11,t11,t01,p.tone>.5?rgb(mix(th.ac,th.s2,.4)):s2);   // face sud
      quad(b10,b11,t11,t10,p.tone>.5?rgb(mix(th.ac,th.s1,.3)):s1);   // face est
      quad(t00,t10,t11,t01,col);
    }else if(sr<1e-3){const q=px(x0,y0,0);g.fillStyle=col;g.fillRect(q[0],q[1],p.s*C+.5,p.s*C*kk+.5)}
    else quad(px(x0,y0,0),px(x1,y0,0),px(x1,y1,0),px(x0,y1,0),col);
  }
  // captions
  if(mode=='proj'&&hz<.3){g.globalAlpha=1-hz/.3;g.font='11px "Helvetica Neue",Helvetica,Arial,sans-serif';g.textBaseline='top';
    tiles.forEach((t,n)=>{const q=px(t.x,t.y+T+.6,0);if(q[1]<-20||q[1]>H)return;
      g.fillStyle=n==hoverTile?th.txt:th.mu;g.fillText(t.p.t.length>22?t.p.t.slice(0,21)+'…':t.p.t,q[0],q[1]);
      g.fillStyle=th.mu;g.fillText(FAM[t.p.fam]+' · '+t.p.y,q[0],q[1]+13)});g.globalAlpha=1}
  // sandbox cursor : the pencil lead is a square
  if(mode=='sand'&&ptr.x>-1e3&&intro>=1){const i=Math.floor(mx),j=Math.floor(my);
    g.strokeStyle=ac;g.lineWidth=1.5;g.beginPath();const a=px(i,j,0),b=px(i+1,j,0),c=px(i+1,j+1,0),d=px(i,j+1,0);g.moveTo(...a);g.lineTo(...b);g.lineTo(...c);g.lineTo(...d);g.closePath();g.stroke()}
  // intro : the contour draws itself, then fills
  if(intro<1){intro=Math.min(1,(now-introT0)/1500);drawIntro(intro)}
  requestAnimationFrame(frame);
}
function drawIntro(t){
  const n=5,o=-2,a=px(o,o-1,0),b=px(o+n,o-1,0),c=px(o+n,o+n-1,0),d=px(o,o+n-1,0);
  const pts=[a,b,c,d,a],k=Math.min(1,t/.6)*4;
  g.strokeStyle=rgb(th.top);g.lineWidth=1.5;g.beginPath();g.moveTo(...a);
  for(let s=0;s<4;s++){const e=Math.min(1,Math.max(0,k-s));if(e<=0)break;const p=pts[s],q=pts[s+1];g.lineTo(p[0]+(q[0]-p[0])*e,p[1]+(q[1]-p[1])*e)}
  g.stroke();
}
function start(){
  resize();Ct=C=mob()?18:22;seedSand();buildBar();
  introT0=performance.now();
  const now=performance.now();
  P=sandList().map(t=>mk({x:t.x,y:t.y,tx:t.x,ty:t.y,s:0,ts:1,h:0,thh:t.h,tt:t.tone,tone:t.tone,k:t.k,d:now+900+(t.x+t.y+6)*55}));
  requestAnimationFrame(frame);
}
start();
})();
</script>
