<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Un seul signe</title>
<style>
@font-face{font-family:Archivo;src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Mono;src:url(fonts/plexmono-400.woff2) format("woff2")}
html,body{margin:0;height:100%;background:#f2f1ed;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#nav{position:fixed;left:0;right:0;bottom:0;height:92px;display:flex;justify-content:center;gap:0;padding-bottom:env(safe-area-inset-bottom)}
#nav button{all:unset;width:64px;height:76px;cursor:pointer}
#nav button:focus-visible{outline:1.5px solid #1d1d1b;outline-offset:-6px}
</style>
</head>
<body>
<canvas id="c" aria-label="Le signe du portfolio. Glisser ou toucher pour l'ouvrir."></canvas>
<nav id="nav" aria-label="États"><button aria-label="Signe"></button><button aria-label="Profondeur"></button><button aria-label="Ouverture"></button><button aria-label="Lecture du projet"></button></nav>
<script>
// Un seul objet : le cube. Vu en axo et en aplat c'est un hexagone ; une face est un losange ;
// de face c'est un carré. Le fond et la navigation sont dessinés avec la même projection.
const cv=document.getElementById('c'),g=cv.getContext('2d');
const BG=[242,241,237],INK=[29,29,27],MID=[118,118,111],LT=[200,199,191];
const img=new Image();img.src='img/varese_ensemble.jpg';
const PRJ={t:'Sospesa',l:'Gare de Varèse, passerelle habitée',m:'Varèse, Italie · Master 1 · 2013–2014'};
const ISO=[Math.PI/4,Math.atan(1/Math.SQRT2)];
// états : yaw, pitch, échelle, face avant (couleur, image), dessus, côté, légende
const ST=[
 {yaw:ISO[0],pit:ISO[1],k:.16,top:INK,fr:INK,ri:INK,im:0,cap:0,asp:0},
 {yaw:ISO[0],pit:ISO[1],k:.16,top:LT,fr:INK,ri:MID,im:0,cap:0,asp:0},
 {yaw:ISO[0]-.12,pit:ISO[1]-.05,k:.2,top:LT,fr:BG,ri:MID,im:1,cap:0,asp:0},
 {yaw:0,pit:0,k:1,top:LT,fr:BG,ri:MID,im:1,cap:1,asp:1}
];
let W,H,dpr,p=0,tgt=0;
const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;placeNav()}
const L=(a,b,t)=>a+(b-a)*t,LC=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),rgb=c=>`rgb(${c.map(Math.round)})`;
const sm=t=>t*t*(3-2*t);
function state(q){const i=Math.min(2,Math.floor(q)),t=sm(Math.min(1,q-i)),A=ST[i],B=ST[i+1],o={};
 for(const k in A)o[k]=Array.isArray(A[k])?LC(A[k],B[k],t):L(A[k],B[k],t);return o}
function cam(yaw,pit){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit);
 return v=>{const x=v[0]*cy-v[2]*sy,z=v[0]*sy+v[2]*cy;return[x,-(v[1]*cp-z*sp),v[1]*sp+z*cp]}}
// faces visibles d'une boîte de demi-côtés hx,hy,hz
function faces(pr,hx,hy,hz){
 const F=[
  {n:'fr',o:[-hx,hy,hz],u:[2*hx,0,0],v:[0,-2*hy,0],N:[0,0,1]},
  {n:'ri',o:[hx,hy,hz],u:[0,0,-2*hz],v:[0,-2*hy,0],N:[1,0,0]},
  {n:'top',o:[-hx,hy,-hz],u:[2*hx,0,0],v:[0,0,2*hz],N:[0,1,0]}];
 return F.filter(f=>pr(f.N)[2]>1e-3).map(f=>{const O=pr(f.o),U=pr(f.u),V=pr(f.v);return{...f,O,U,V,
  pts:[O,[O[0]+U[0],O[1]+U[1]],[O[0]+U[0]+V[0],O[1]+U[1]+V[1]],[O[0]+V[0],O[1]+V[1]]]}})}
function poly(pts,x,y,s){g.beginPath();pts.forEach((q,i)=>g[i?'lineTo':'moveTo'](x+q[0]*s,y+q[1]*s));g.closePath()}
function cube(S,x,y,s,hx,hy,hz,alpha){
 const pr=cam(S.yaw,S.pit);g.globalAlpha=alpha;
 for(const f of faces(pr,hx,hy,hz)){
  const c=rgb(S[f.n]);poly(f.pts,x,y,s);g.fillStyle=c;g.fill();g.strokeStyle=c;g.lineWidth=.8;g.stroke();
  if(f.n==='fr'&&S.im>0&&img.complete&&img.naturalWidth){
   g.save();poly(f.pts,x,y,s);g.clip();g.globalAlpha=alpha*S.im;
   const iw=img.naturalWidth,ih=img.naturalHeight,d=dpr;
   g.setTransform(d*f.U[0]*s/iw,d*f.U[1]*s/iw,d*f.V[0]*s/ih,d*f.V[1]*s/ih,d*(x+f.O[0]*s),d*(y+f.O[1]*s));
   g.drawImage(img,0,0);g.restore();g.setTransform(dpr,0,0,dpr,0,0);g.globalAlpha=alpha}
 }
 g.globalAlpha=1}
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]),lo=[],up=[];
 for(const q of P){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q)}
 for(const q of P.reverse()){while(up.length>1&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q)}
 return lo.slice(0,-1).concat(up.slice(0,-1))}
const navY=()=>H-46-(parseFloat(getComputedStyle(document.body).paddingBottom)||0);
function navX(i){return W/2+(i-1.5)*64}
function placeNav(){}
function frame(){
 p+=(tgt-p)*(red?1:.085);if(Math.abs(tgt-p)<.0005)p=tgt;
 const S=state(p);g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle=rgb(BG);g.fillRect(0,0,W,H);
 const ar=img.naturalWidth?img.naturalWidth/img.naturalHeight:1.5;
 const hx=L(1,ar>1?1:ar,S.asp),hy=L(1,ar>1?1/ar:1,S.asp),hz=1;
 // zone de lecture
 const top=56,bot=H-112,availW=W-32,availH=bot-top-(S.cap>0?70:0)*S.asp;
 const sMin=Math.min(W,H-170),s0=sMin*.16/ (1) ;
 const sRead=Math.min(availW/(2*hx),(bot-top-70)/(2*hy));
 const s=L(sMin*Math.min(S.k,.2)/.16*.16,sRead,S.asp);
 const cx=W/2,cy=L((top+bot)/2,top+hy*sRead,S.asp);
 // silhouette pour le fond (même caméra)
 const pr=cam(S.yaw,S.pit),corners=[];for(const a of[-1,1])for(const b of[-1,1])for(const c of[-1,1])corners.push(pr([a,b,c]));
 const hu=hull(corners);
 const ex=Math.max(...corners.map(q=>Math.abs(q[0]))),ey=Math.max(...corners.map(q=>Math.abs(q[1])));
 const bx=ex*s*hx+26,by=ey*s*hy+26;
 const step=W<600?24:28,ms=step*.12;
 g.fillStyle='rgb(226,225,218)';
 for(let y=step*2.5;y<H-90;y+=step)for(let x=step/2;x<W;x+=step){
  const dx=Math.max(0,Math.abs(x-cx)-bx),dy=Math.max(0,Math.abs(y-cy)-by-(S.cap*60*(y>cy?1:0)));
  const d=Math.hypot(dx,dy),k=Math.min(1,d/90);if(k<.05)continue;
  poly(hu,x,y,ms*sm(k));g.fill()}
 cube(S,cx,cy,s,hx,hy,hz,1);
 const ca=Math.pow(S.cap,6);if(ca>.01){g.globalAlpha=ca;g.fillStyle=rgb(INK);g.textAlign='left';g.textBaseline='top';
  const x0=cx-hx*s,y0=cy+hy*s+14;g.font='600 17px Archivo';g.fillText(PRJ.t,x0,y0);
  g.font='14px Archivo';g.fillText(PRJ.l,x0,y0+22);g.fillStyle=rgb(MID);g.font='10.5px Mono';g.fillText(PRJ.m,x0,y0+42);g.globalAlpha=1}
 // en-tête
 g.fillStyle=rgb(INK);g.font='600 14px Archivo';g.textAlign='left';g.textBaseline='alphabetic';g.fillText('Yves Micault',16,32);
 g.fillStyle=rgb(MID);g.font='10.5px Mono';g.textAlign='right';g.fillText(['signe','profondeur','ouverture','lecture'][Math.round(p)],W-16,32);
 // navigation : les quatre états dessinés par le même cube
 const ny=navY();g.fillStyle='rgb(224,223,216)';g.fillRect(W/2-128,ny-46,256,1);
 for(let i=0;i<4;i++){const T={...ST[i],asp:0},on=Math.abs(p-i)<.5;
  cube(T,navX(i),ny,9,i===3?1.25:1,i===3?.83:1,1,on?1:.32)}
 const kx=navX(0)+p*64;g.fillStyle=rgb(INK);g.fillRect(kx-10,ny+22,20,2);
 requestAnimationFrame(frame)}
// gestes : glisser = parcourir les états (réversible), toucher = état suivant / retour au signe
let down=null;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,p,m:0};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x;if(Math.abs(dx)>6)down.m=1;if(down.m){tgt=Math.max(0,Math.min(3,down.p+dx/160));p=tgt}});
cv.addEventListener('pointerup',()=>{if(!down)return;tgt=down.m?Math.round(tgt):(Math.round(p)>=3?0:Math.round(p)+1);down=null});
document.querySelectorAll('#nav button').forEach((b,i)=>b.addEventListener('click',()=>tgt=i));
addEventListener('keydown',e=>{if(e.key==='ArrowRight')tgt=Math.min(3,Math.round(tgt)+1);if(e.key==='ArrowLeft')tgt=Math.max(0,Math.round(tgt)-1)});
addEventListener('resize',fit);
const q=new URLSearchParams(location.search);if(q.has('p'))p=tgt=+q.get('p');
fit();document.fonts.ready.then(()=>requestAnimationFrame(frame));
</script>
</body>
</html>
