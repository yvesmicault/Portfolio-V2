<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collection, étude</title>
<style>
@font-face{font-family:Archivo;src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Mono;src:url(fonts/plexmono-400.woff2) format("woff2");font-weight:400}
:root{--bg:#fbfbf9;--ink:#1c1c1a;--mut:#8b8b85;--hair:#e4e4df}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-columns:230px 1fr;overflow:hidden}
aside{padding:28px 24px;display:flex;flex-direction:column;gap:26px;border-right:1px solid var(--hair)}
.who{font-weight:600;font-stretch:88%;font-size:15px;letter-spacing:.01em}
.who small{display:block;font-family:Mono;font-size:10.5px;color:var(--mut);font-weight:400;margin-top:3px;letter-spacing:.04em}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl b{font-family:Mono;font-weight:400;font-size:10px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;gap:14px}
.seg button{all:unset;cursor:pointer;font-size:14px;font-stretch:92%;color:var(--mut);padding:2px 0;border-bottom:1.5px solid transparent;transition:color .3s,border-color .3s}
.seg button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.leg{display:grid;grid-template-columns:repeat(2,auto);gap:5px 14px;justify-content:start;font-family:Mono;font-size:10.5px;color:var(--mut)}
.leg i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:-1px}
.info{margin-top:auto;font-size:13px;line-height:1.4;min-height:60px}
.info .t{font-weight:600;font-stretch:90%}
.info .m{font-family:Mono;font-size:10.5px;color:var(--mut);margin-top:3px}
main{position:relative;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
@media (max-width:700px){
 body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
 aside{display:contents}
 .band{padding:14px 16px 10px;border-bottom:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end}
 .who{flex:1 0 100%;display:flex;justify-content:space-between;align-items:baseline}
 .who small{margin:0}
 .ctl{flex-direction:row;align-items:baseline;gap:10px}
 .foot{grid-row:3;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
 .leg{grid-template-columns:repeat(4,auto)}
 .info{min-height:38px;margin:0}
}
@media (min-width:701px){.band,.foot{display:contents}}
</style>
</head>
<body>
<aside>
 <div class="band">
  <div class="who">Yves Micault<small>9 projets · étude de collection</small></div>
  <div class="ctl"><b>Classer</b><div class="seg" id="mode"><button aria-pressed="true" data-v="year">Année</button><button aria-pressed="false" data-v="prog">Programme</button></div></div>
  <div class="ctl"><b>Lire</b><div class="seg" id="view"><button aria-pressed="false" data-v="0">Plan</button><button aria-pressed="true" data-v="1">Axo</button></div></div>
 </div>
 <div class="foot">
  <div class="info" id="info" aria-live="polite"><div class="m">Touchez un signe.</div></div>
  <div class="leg"><span><i style="background:#1c1c1a"></i>bâti</span><span><i style="background:#9db38c"></i>sol vivant</span><span><i style="background:#86a9c6"></i>eau</span><span><i style="background:#d6d5cf"></i>voie</span></div>
 </div>
</aside>
<main><canvas id="c" aria-label="Collection de projets"></canvas></main>
<script>
// Chaque projet : un signe sur la même trame 6×6 (le carré), extrudé en axo (le cube).
// m : b bâti, v sol vivant, e eau, r voie. Signes interprétatifs, à valider.
const B=(x,y,w,d,h,m='b',z0=0)=>({x,y,w,d,h,m,z0});
const S={
 varese:[B(0,1.6,6,.35,.04,'r'),B(0,3.9,6,.35,.04,'r'),B(0,.6,1.4,4.8,1.3),B(4.6,.6,1.4,4.8,1.3),B(1.4,2.5,3.2,1,.32,'b',1.05)],
 agri:[B(0,0,3,3,.04,'v'),B(3,3,3,3,.04,'v'),B(.3,.9,.4,.4,.7),B(5.3,.9,.4,.4,.7),B(0,.8,6,.6,.45,'b',.7),B(.3,4.1,.4,.4,.7),B(5.3,4.1,.4,.4,.7),B(0,4,6,.6,.45,'b',.7)],
 terminus:[B(1,1,5,4,.04,'e'),B(0,0,6,1,1.1),B(0,1,1,5,.7),B(1,5,5,1,.35),B(3,2.4,1.2,1.2,.5)],
 elle:[B(0,2,4.5,4,.04,'v'),B(4,.5,1.5,1.5,5),B(0,3.6,5,1,.8,'b',.85),B(.2,3.6,.4,1,.85),B(4.4,3.6,.4,1,.85)],
 ventres:[B(.2,.2,1.8,1.8,.04,'r'),B(.5,.5,.8,.8,.8),B(1.3,.5,.5,.5,.45),B(3.8,.9,1.8,1.8,.04,'r'),B(4.1,1.1,.9,.9,1.1),B(5,1.9,.5,.5,.5),B(1.2,3.9,1.8,1.8,.04,'r'),B(1.4,4.1,.8,.8,.7),B(2.2,4.9,.5,.5,.4),B(4.3,4.3,1.4,1.4,.04,'r'),B(4.5,4.5,.7,.7,.9)],
 crank:[B(.8,2.5,4.4,1,.75),B(2.5,.8,1,4.4,.75,'b',.75),B(1.6,2.5,4.4,1,.75,'b',1.5)],
 synergies:[B(0,2.2,6,1.6,.04,'e'),B(0,0,6,2.2,.04,'v'),B(.6,.5,1.2,1.2,.9),B(2.4,.7,.8,.8,.6),B(0,3.8,6,2.2,.04,'r'),B(3.8,4.3,1.6,1.2,.8),B(2.7,1.7,.6,2.6,.18,'b',.35)],
 siberian:[B(0,4.3,6,.25,.04,'r'),B(0,4.75,6,.25,.04,'r'),B(2,1.4,2,2,2)],
 equilibrium:[B(1,1,4,.7,.4),B(4.3,1.7,.7,3.3,.9),B(1,4.3,3.3,.7,1.4),B(1,1.7,.7,2.6,1.9)]
};
const P={
 varese:{n:'Sospesa',y:2013,g:'Équipement',l:'Gare de Varèse, passerelle habitée',f:'Études'},
 agri:{n:'Champ libre',y:2013,g:'Urbain & paysage',l:'Fermes-ponts, parc-pâturage',f:'Études'},
 terminus:{n:'Terminus',y:2015,g:'Équipement',l:'Le bassin, Copenhague',f:'Études, PFE'},
 elle:{n:'Elle',y:2015,g:'Logement',l:'Tour mixte, Copenhague',f:'Études, PFE'},
 siberian:{n:'Siberian Spotlight',y:2016,g:'Équipement',l:'Halte du Transsibérien',f:'Concours'},
 equilibrium:{n:'Equilibrium',y:2016,g:'Équipement',l:'Landmark, parcours',f:'Concours'},
 synergies:{n:'Synergies latentes',y:2019,g:'Urbain & paysage',l:'Europan 15, rives',f:'Concours'},
 crank:{n:'The Crank House',y:2020,g:'Logement',l:'Cabane nomade',f:'Concours'},
 ventres:{n:'Les petits ventres-villes',y:2021,g:'Urbain & paysage',l:'Europan 16, centralités',f:'Concours'}
};
const IDS=Object.keys(P);
const COL={b:['#1c1c1a','#55554f','#8f8f88'],v:['#9db38c'],e:['#86a9c6'],r:['#d6d5cf']};
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W=0,H=0,dpr=1,mode='year',axo=1,axoT=1,sel=null,hov=null;
const cur={},from={},to={};let t0=0,labOld=[],labNew=[],cellOld=0,cellNew=0;
const red=matchMedia('(prefers-reduced-motion: reduce)').matches;

function groups(m){
 if(m==='year'){const a=[];for(let y=2013;y<=2021;y++)a.push({t:String(y),ids:IDS.filter(i=>P[i].y===y)});return a}
 return['Équipement','Urbain & paysage','Logement'].map(t=>({t,ids:IDS.filter(i=>P[i].g===t)}));
}
function layout(m){
 const G=groups(m),phone=W<560,padL=phone?16:64+70,hd=phone?20:0,padR=phone?16:56,padT=phone?18:46,padB=phone?14:40;
 const aw=W-padL-padR,ah=H-padT-padB,empty=phone?14:20;
 let s=phone?150:190;
 for(;s>40;s-=2){const cols=Math.max(1,Math.floor(aw/s));let h=0;for(const q of G)h+=q.ids.length?hd+Math.ceil(q.ids.length/cols)*s*1.12:empty;if(h<=ah)break}
 const cols=Math.max(1,Math.floor(aw/s));let hs=0;for(const q of G)hs+=q.ids.length?hd+Math.ceil(q.ids.length/cols)*s*1.12:empty;
 let y=padT+Math.max(0,(ah-hs)/2);const pos={},lab=[];
 for(const q of G){
  if(!q.ids.length){lab.push({t:q.t,x:phone?padL:padL-14,y:y+empty/2,e:1,w:aw,top:phone});y+=empty;continue}
  lab.push({t:q.t,x:phone?padL:padL-14,y:phone?y+11:y+s*.5,y0:y,w:aw,top:phone});y+=hd;
  q.ids.forEach((id,k)=>{const r=Math.floor(k/cols),c=k%cols;pos[id]=[padL+c*s+s/2,y+r*s*1.12+s*.5]});
  y+=Math.ceil(q.ids.length/cols)*s*1.12;
 }
 return{pos,lab,s};
}
function setMode(m,snap){
 mode=m;const L=layout(m);
 for(const id of IDS){from[id]=cur[id]?[...cur[id]]:[...L.pos[id]];to[id]=L.pos[id]}
 labOld=labNew;labNew=L.lab;cellOld=cellNew||L.s;cellNew=L.s;t0=performance.now()-(snap||red?1e5:0);
}
function fit(){dpr=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;setMode(mode,true);for(const id of IDS)cur[id]=[...to[id]]}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function sign(id,cx,cy,s,alpha){
 const u=s/10.5,r=Math.PI/4*axo-.0,ca=Math.cos(r),sa=Math.sin(r),k=1-.45*axo,hz=.86*axo;
 const oy=cy+s*.06*axo;
 const p=(x,y,z)=>{x-=3;y-=3;const X=x*ca-y*sa,Y=x*sa+y*ca;return[cx+X*u,oy+(Y*k-z*hz)*u]};
 const bx=S[id].slice().sort((a,b)=>{const fa=a.h<.1,fb=b.h<.1;if(fa!==fb)return fa?-1:1;
  const da=(a.x+a.w/2-3)*sa+(a.y+a.d/2-3)*ca+a.z0*.9,db=(b.x+b.w/2-3)*sa+(b.y+b.d/2-3)*ca+b.z0*.9;return da-db});
 g.globalAlpha=alpha;
 for(const b of bx){
  const z1=b.z0+b.h,c=[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.d],[b.x,b.y+b.d]],tone=COL[b.m];
  if(b.h>=.1&&axo>.02){
   for(let i=0;i<4;i++){const a=c[i],q=c[(i+1)%4],nx=q[1]-a[1],ny=-(q[0]-a[0]);const Y=nx*sa+ny*ca,X=nx*ca-ny*sa;
    if(Y<=.01)continue;g.fillStyle=X<0?tone[1]:tone[2];g.beginPath();
    const A=p(a[0],a[1],b.z0),Bq=p(q[0],q[1],b.z0),C=p(q[0],q[1],z1),D=p(a[0],a[1],z1);
    g.moveTo(...A);g.lineTo(...Bq);g.lineTo(...C);g.lineTo(...D);g.closePath();g.fill()}
  }
  g.fillStyle=tone[0];g.beginPath();c.forEach((a,i)=>{const P2=p(a[0],a[1],z1);i?g.lineTo(...P2):g.moveTo(...P2)});g.closePath();g.fill();
 }
 // nom
 g.fillStyle='#1c1c1a';g.textAlign='center';g.textBaseline='top';
 const fs=Math.max(10.5,Math.min(13,s*.085));g.font=`500 ${fs}px Archivo`;
 g.fillText(P[id].n,cx,cy+s*.43,s*.96);
 g.globalAlpha=1;
}
function labels(L,a,s){
 if(a<=0)return;g.globalAlpha=a;g.textAlign='right';g.textBaseline='middle';
 for(const l of L){
  g.fillStyle=l.e?'#c4c4be':'#8b8b85';g.font=`${l.e?10:11}px Mono`;g.textAlign=l.top?'left':'right';g.fillText(l.t,l.x,l.y);
  g.fillStyle='#e9e9e4';
  if(l.top){const tw=g.measureText(l.t).width+10;g.fillRect(l.x+tw,l.y,l.w-tw,1)}
  else if(!l.e)g.fillRect(l.x+8,l.y0+.5,l.w+6,1);else g.fillRect(l.x+8,l.y,l.w+6,1);
 }
 g.globalAlpha=1;
}
function frame(now){
 axo+=(axoT-axo)*(red?1:.12);if(Math.abs(axoT-axo)<.001)axo=axoT;
 g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
 const T=(now-t0)/1000;
 labels(labOld,1-Math.min(1,T/.35),cellOld);labels(labNew,Math.min(1,Math.max(0,(T-.55)/.4)),cellNew);
 const order=IDS.slice().sort((a,b)=>cur[a][1]-cur[b][1]);
 IDS.forEach((id,i)=>{const t=ease(Math.min(1,Math.max(0,(T*1000-i*55)/800)));
  cur[id]=[from[id][0]+(to[id][0]-from[id][0])*t,from[id][1]+(to[id][1]-from[id][1])*t]});
 const s=cellOld+(cellNew-cellOld)*ease(Math.min(1,T/1.1));
 for(const id of order){const a=sel&&sel!==id?.22:(hov&&hov!==id?.55:1);sign(id,cur[id][0],cur[id][1],s,a)}
 requestAnimationFrame(frame);
}
function hit(e){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,s=cellNew;
 return IDS.find(id=>Math.abs(cur[id][0]-x)<s*.45&&Math.abs(cur[id][1]-y)<s*.5)||null}
const info=document.getElementById('info');
function show(id){info.innerHTML=id?`<div class="t">${P[id].n}</div><div class="m">${P[id].y} · ${P[id].f} · ${P[id].l}</div>`:'<div class="m">Touchez un signe.</div>'}
cv.addEventListener('click',e=>{const id=hit(e);sel=id===sel?null:id;show(sel)});
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;hov=hit(e);cv.style.cursor=hov?'pointer':'default'});
for(const [el,fn] of [[document.getElementById('mode'),v=>setMode(v)],[document.getElementById('view'),v=>axoT=+v]])
 el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.v)});
addEventListener('resize',fit);
const q=new URLSearchParams(location.search);if(q.get('mode')==='prog'){mode='prog';document.querySelector('#mode [data-v=prog]').click()}
document.fonts.ready.then(()=>{fit();requestAnimationFrame(frame)});
</script>
</body>
</html>
