<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Identité cube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--ink:#f2efe8;--mute:#77746e}
body.jour{--bg:#efece6;--ink:#151515;--mute:#8b867c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header,footer{position:fixed;left:0;right:0;padding:16px 18px;display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;z-index:2;pointer-events:none}
header{top:env(safe-area-inset-top)}footer{bottom:env(safe-area-inset-bottom);color:var(--mute)}
header b{font-weight:500}header span{color:var(--mute)}
button{pointer-events:auto;font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit;text-transform:inherit}
#step{transition:opacity .4s}
@media (max-width:700px){footer span:last-child{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><div><b>Yves Micault</b> <span>· architecte</span></div><button id="mode">Jour</button></header>
<footer><span id="step">01 · le carré</span><span>touchez pour rejouer · déplacez la lumière</span></footer>
<script src="data.js"></script>
<script>
/* Planche d'identité : le carré devient losange puis cube, le cube se divise en trame 3×3,
   se répète en motif, et une lumière projetée parcourt les faces (esprit ISAM). Tout est en aplats vectoriels. */
const cv=document.getElementById("c"),x=cv.getContext("2d");
let W,H,DPR,S;
function size(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);S=Math.min(W,H)*(W<700?.2:.15)}
addEventListener("resize",size);size();
const C30=Math.cos(Math.PI/6),S30=.5;
const iso=(X,Y,Z,s,ox,oy)=>[ox+(X-Z)*C30*s,oy+(X+Z)*S30*s-Y*s];
const col=v=>getComputedStyle(document.body).getPropertyValue(v).trim();
let INK,BG,night=true;
function tones(){INK=col("--ink");BG=col("--bg")}tones();
document.getElementById("mode").onclick=()=>{night=!night;document.body.classList.toggle("jour",!night);document.getElementById("mode").textContent=night?"Jour":"Nuit";tones()};
const E=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,cl=t=>Math.max(0,Math.min(1,t)),seg=(t,a,b)=>E(cl((t-a)/(b-a)));
// trois tons d'aplat, comme un logo isométrique
function face(i,l){// i: 0 dessus, 1 gauche, 2 droite ; l: lumière 0..1
  const base=night?[.94,.42,.16][i]:[.97,.62,.24][i];const v=Math.min(1,base+l*(night?.55:.35));
  const g=night?Math.round(v*242):Math.round(v*236);return `rgb(${g},${night?Math.round(v*239):Math.round(v*233)},${night?Math.round(v*232):Math.round(v*226)})`}
function poly(p,fill,stroke,lw){x.beginPath();x.moveTo(p[0][0],p[0][1]);for(let k=1;k<p.length;k++)x.lineTo(p[k][0],p[k][1]);x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||1;x.stroke()}}
const lerp=(a,b,t)=>a+(b-a)*t,lp=(p,q,t)=>[lerp(p[0],q[0],t),lerp(p[1],q[1],t)];

/* les projets : quelques images posées sur les faces du dessus du motif */
const IM=(window.PROJ||[]).filter(p=>p.th).slice(0,9).map(p=>{const i=new Image();i.src=p.th;return {i,t:p.t}});

let t0=performance.now(),mx=.5,my=.4,TOT=17;
cv.addEventListener("pointermove",e=>{mx=e.clientX/W;my=e.clientY/H});
cv.addEventListener("pointerdown",e=>{mx=e.clientX/W;my=e.clientY/H;t0=performance.now()});
const STEPS=[[0,"01 · le carré"],[2,"02 · le losange, puis le cube"],[4,"03 · la trame 3×3"],[6.5,"04 · le motif"],[9,"05 · la lumière projetée"],[12.5,"06 · les projets dans le motif"],[15.5,"07 · retour au cube"]];
let lastStep="";
function cubeAt(cx,cy,s,l,sub,lw){// cube plein en aplats, arêtes au trait
  const P=(X,Y,Z)=>iso(X,Y,Z,s,cx,cy);
  const top=[P(-.5,.5,-.5),P(.5,.5,-.5),P(.5,.5,.5),P(-.5,.5,.5)];
  const left=[P(-.5,.5,.5),P(.5,.5,.5),P(.5,-.5,.5),P(-.5,-.5,.5)];
  const right=[P(.5,.5,.5),P(.5,.5,-.5),P(.5,-.5,-.5),P(.5,-.5,.5)];
  poly(top,face(0,l[0]));poly(left,face(1,l[1]));poly(right,face(2,l[2]));
  if(sub>0){x.strokeStyle=BG;x.lineWidth=lw*1.6;x.globalAlpha=sub;x.beginPath();
    for(const k of [-1/6,1/6]){let a=P(k,.5,-.5),b=P(k,.5,.5);x.moveTo(...a);x.lineTo(...b);a=P(-.5,.5,k);b=P(.5,.5,k);x.moveTo(...a);x.lineTo(...b);
      a=P(k,.5,.5);b=P(k,-.5,.5);x.moveTo(...a);x.lineTo(...b);a=P(-.5,k,.5);b=P(.5,k,.5);x.moveTo(...a);x.lineTo(...b);
      a=P(.5,.5,k);b=P(.5,-.5,k);x.moveTo(...a);x.lineTo(...b);a=P(.5,k,-.5);b=P(.5,k,.5);x.moveTo(...a);x.lineTo(...b)}x.stroke();x.globalAlpha=1}
  return top}
function frame(now){requestAnimationFrame(frame);
  const t=Math.max(0,(now-t0)/1000)%TOT;x.fillStyle=BG;x.fillRect(0,0,W,H);
  const st=STEPS.filter(s=>t>=s[0]).pop()[1];if(st!=lastStep){lastStep=st;const el=document.getElementById("step");el.textContent=st}
  const cx=W/2,cy=H*.5;
  // 1-2 : le carré se dessine, pivote, s'écrase en losange, puis s'extrude
  const a=seg(t,0,1.2),b=seg(t,2,3),c=seg(t,3,4.2),d=seg(t,4.2,5.4),back=seg(t,15.5,16.8);
  const pat=seg(t,6.5,9)*(1-back),light=seg(t,9,10)*(1-seg(t,15,15.6)),proj=seg(t,12.5,13.5)*(1-seg(t,15,15.6));
  const s=S;
  if(c<1&&back==0){// carré → losange
    const sq=[[-.5,-.5],[.5,-.5],[.5,.5],[-.5,.5]].map(([u,v])=>[cx+u*s*1.15,cy+v*s*1.15-s*.5*b]);
    const rh=[iso(-.5,.5,-.5,s,cx,cy),iso(.5,.5,-.5,s,cx,cy),iso(.5,.5,.5,s,cx,cy),iso(-.5,.5,.5,s,cx,cy)];
    const p=sq.map((q,k)=>lp(q,rh[k],b));
    // le trait se dessine
    x.save();x.setLineDash([4*s,4*s]);x.lineDashOffset=4*s*(1-a);poly(p,a>=1?face(0,0):null,INK,1.5);x.restore();
  }
  if(c>0){
    // le motif : le cube se répète en couronnes autour du centre (pavage isométrique)
    const step=s,ox=cx,oy=cy;const R=Math.ceil(Math.max(W,H)/s)+2;
    const cubes=[];
    // pavage en « cubes empilés » : chaque cube montre ses trois faces
    for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const px=ox+(i*2+(j&1))*C30*step,py=oy+j*1.5*step;
      if(px<-step||px>W+step||py<-step*1.5||py>H+step*1.5)continue;
      const dist=Math.hypot(px-cx,py-cy)/Math.max(W,H);const show=(i==0&&j==0)?1:cl(pat*1.6-dist*1.4);if(show<=0)continue;cubes.push({px,py,dist,show,i,j})}
    cubes.sort((p,q)=>p.j-q.j);
    const lx=mx*W,ly=my*H;
    for(const q of cubes){
      // lumière projetée : bandes qui parcourent le motif + tache autour du doigt
      let L=[0,0,0];
      if(light>0){const band=Math.sin((q.px*.006+q.py*.011)-t*3.2);const band2=Math.sin(q.px*.013-t*2.1+q.j);
        const spot=Math.max(0,1-Math.hypot(q.px-lx,q.py-ly)/(s*2.6));
        L=[Math.max(0,band)*.8*light+spot*.6,Math.max(0,band2)*.5*light+spot*.4,Math.max(0,-band)*.4*light+spot*.2]}
      const lift=light>0?Math.max(0,Math.sin(t*2.4-q.dist*14))*s*.22*light*(q.i||q.j?1:0):0;
      const k=q.i==0&&q.j==0?1:q.show;
      x.globalAlpha=k;
      const scale=(q.i==0&&q.j==0)?s*(1-pat*0):s*E(cl(q.show));
      const ext=(q.i==0&&q.j==0)?c:1;
      // extrusion : le cube monte depuis le losange
      const P=(X,Y,Z)=>iso(X,Y,Z,scale,q.px,q.py-lift);
      const h=ext,bt=.5-h; const top=[P(-.5,.5,-.5),P(.5,.5,-.5),P(.5,.5,.5),P(-.5,.5,.5)];
      const left=[P(-.5,.5,.5),P(.5,.5,.5),P(.5,bt,.5),P(-.5,bt,.5)];
      const right=[P(.5,.5,.5),P(.5,.5,-.5),P(.5,bt,-.5),P(.5,bt,.5)];
      // le cube du centre garde sa place (le losange était à la hauteur du dessus)
      if(q.i==0&&q.j==0){const off=s*.5*(1-h);for(const arr of [top,left,right])arr.forEach(p=>p[1]-=0)}
      poly(left,face(1,L[1]));poly(right,face(2,L[2]));poly(top,face(0,L[0]));
      // la trame 3×3 se grave sur les faces
      const sub=(q.i==0&&q.j==0)?d:Math.min(d,1)*.9;
      if(sub>0){x.strokeStyle=BG;x.lineWidth=Math.max(1,scale*.025);x.beginPath();
        for(const f of [1/3,2/3]){let A=lp(top[0],top[1],f),B=lp(top[3],top[2],f);x.moveTo(...A);x.lineTo(...B);A=lp(top[0],top[3],f);B=lp(top[1],top[2],f);x.moveTo(...A);x.lineTo(...B);
          A=lp(left[0],left[1],f);B=lp(left[3],left[2],f);x.moveTo(...A);x.lineTo(...B);A=lp(left[0],left[3],f);B=lp(left[1],left[2],f);x.moveTo(...A);x.lineTo(...B);
          A=lp(right[0],right[1],f);B=lp(right[3],right[2],f);x.moveTo(...A);x.lineTo(...B);A=lp(right[0],right[3],f);B=lp(right[1],right[2],f);x.moveTo(...A);x.lineTo(...B)}
        x.globalAlpha=k*sub;x.stroke()}
      // projets : l'image projetée sur la face du dessus, comme un mapping
      if(proj>0&&IM.length&&(q.i*7+q.j*3)%5==0&&(q.i||q.j)){const im=IM[Math.abs(q.i*3+q.j*5)%IM.length];if(im.i.complete&&im.i.naturalWidth){
        x.save();x.globalAlpha=k*proj;const o=top[0],u=top[1],v=top[3];
        x.setTransform(DPR*(u[0]-o[0])/360,DPR*(u[1]-o[1])/360,DPR*(v[0]-o[0])/360,DPR*(v[1]-o[1])/360,DPR*o[0],DPR*o[1]);x.drawImage(im.i,0,0,360,360);x.restore()}}
      x.globalAlpha=1}
    // le cube du centre se détache : le logo
    if(back>0||pat<.05){}
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
